<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabibako（旅箱）</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <!-- Tabler Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css"
  />

  <style>
    /* ===== デザイントークン（モック v6 をベースに定義） ===== */
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f5f4;
      --color-background-info: #e6f1fb;
      --color-background-info-hover: #d9e9f7;
      --color-background-success: #e1f5ee;
      --color-background-tag: #eeedfe;
      --color-background-photo-placeholder: #c9d9e8;
      --color-background-error: #fef2f2;

      --color-border-secondary: #d6d3d1;
      --color-border-tertiary: #e7e5e4;
      --color-border-info: #b5d4f4;
      --color-border-success: #9fe1cb;
      --color-border-tag: #cecbf6;
      --color-border-error: #fecaca;

      --color-text-primary: #1c1917;
      --color-text-secondary: #78716c;
      --color-text-info: #0c447c;
      --color-text-success: #085041;
      --color-text-tag: #3c3489;
      --color-text-photo-placeholder: #88aabb;
      --color-text-error: #c53030;

      --border-radius-md: 6px;
      --border-radius-lg: 10px;
    }

    /* ===== ベース ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
        "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 13px;
      color: var(--color-text-primary);
      background: var(--color-background-secondary);
    }

    /* ===== アプリ全体（3カラム / 100vh） ===== */
    .app {
      display: grid;
      grid-template-columns: 384px 1fr 390px;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== 左パネル ===== */
    .left {
      background: var(--color-background-primary);
      border-right: 0.5px solid var(--color-border-tertiary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .left-toolbar {
      padding: 8px 10px;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      position: relative;
    }
    .left-toolbar-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-primary);
      flex: 1;
    }
    .icon-btn {
      width: 26px;
      height: 26px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      color: var(--color-text-secondary);
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--color-background-secondary); }
    .icon-btn.active {
      background: var(--color-background-info);
      border-color: var(--color-border-info);
      color: var(--color-text-info);
    }
    .trip-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .trip-list-empty {
      padding: 24px 12px;
      text-align: center;
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }

    /* ===== 中央パネル（地図） ===== */
    .center {
      position: relative;
      overflow: hidden;
    }
    #map { position: absolute; inset: 0; }

    .map-pin-count {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      padding: 4px 8px;
      font-size: 11px;
      color: var(--color-text-secondary);
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .map-heatmap-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 500;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--color-text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
    }
    .map-heatmap-btn:hover { background: var(--color-background-secondary); }

    /* Leaflet 標準のズームコントロールはモックの右下配置にあわせて調整 */
    .leaflet-bottom.leaflet-right { margin: 0 8px 12px 0; }

    /* ===== 右パネル ===== */
    .right {
      background: var(--color-background-primary);
      border-left: 0.5px solid var(--color-border-tertiary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .photo-viewer {
      height: 140px;
      flex-shrink: 0;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-background-photo-placeholder);
      color: var(--color-text-photo-placeholder);
    }
    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .detail-empty {
      padding: 24px 4px;
      text-align: center;
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .detail-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .detail-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-primary);
      word-break: break-word;
    }
    .detail-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-section-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      font-weight: 500;
    }
    .detail-section-value {
      font-size: 12px;
      color: var(--color-text-primary);
    }
    .detail-place-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-place-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      font-size: 12px;
      color: var(--color-text-primary);
      word-break: break-word;
    }
    .detail-footer {
      padding: 8px 12px;
      border-top: 0.5px solid var(--color-border-tertiary);
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-sm {
      font-size: 11px;
      padding: 4px 10px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-sm:hover:not(:disabled) { background: var(--color-background-secondary); }
    .btn-sm:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      font-size: 12px;
      padding: 6px 14px;
      border: 0.5px solid var(--color-border-info);
      border-radius: var(--border-radius-md);
      background: var(--color-background-info);
      color: var(--color-text-info);
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary:hover:not(:disabled) { background: var(--color-background-info-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== 旅行カード（左パネル）===== */
    .trip-card {
      padding: 10px;
      margin-bottom: 6px;
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .trip-card:hover {
      background: var(--color-background-secondary);
    }
    .trip-card.selected {
      border-color: var(--color-border-info);
      background: var(--color-background-info);
    }
    /* キーボード操作時のみフォーカスリング表示。マウスクリックでは出ない */
    .trip-card:focus-visible {
      outline: 2px solid var(--color-border-info);
      outline-offset: 1px;
    }
    .trip-card-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 4px;
      word-break: break-word;
    }
    .trip-card-meta {
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .trip-card-meta-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* 旅行カード：移動手段・同行者・タグの全件横スクロール表示（Issue #2 決定通り） */
    .trip-card-tags {
      display: flex;
      flex-direction: row;
      gap: 3px;
      margin-top: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 2px;
    }
    .trip-card-tags::-webkit-scrollbar { height: 4px; }
    .trip-card-tags::-webkit-scrollbar-thumb {
      background: var(--color-border-tertiary);
      border-radius: 2px;
    }
    .trip-card-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.4;
    }
    .trip-card-tag-transport {
      background: var(--color-background-info);
      color: var(--color-text-info);
    }
    .trip-card-tag-companions {
      background: var(--color-background-success);
      color: var(--color-text-success);
    }
    .trip-card-tag-tags {
      background: var(--color-background-tag);
      color: var(--color-text-tag);
    }

    /* ===== 地図ピン（Tabler Icon ベース）===== */
    /* L.divIcon の親要素。.leaflet-div-icon の白背景・枠線を打ち消す */
    .tabibako-pin {
      background: transparent;
      border: none;
    }
    .tabibako-pin .ti {
      font-size: 32px;
      color: var(--color-text-info);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      line-height: 1;
    }

    /* ===== 地図ピックモード ===== */
    body.pick-mode #map { cursor: crosshair; }
    .pick-mode-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 600;
      background: var(--color-background-info);
      border: 0.5px solid var(--color-border-info);
      border-radius: var(--border-radius-md);
      padding: 6px 14px;
      font-size: 12px;
      color: var(--color-text-info);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    /* ===== モーダル ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: background 0.15s;
    }
    .modal-backdrop[hidden] { display: none; }

    /* ピックモード中はモーダルが右下に縮小し、背景透過で地図クリック可能 */
    .modal-backdrop.pick-mode {
      background: transparent;
      align-items: flex-end;
      justify-content: flex-end;
      pointer-events: none;
    }
    .modal-backdrop.pick-mode .modal {
      pointer-events: auto;
      width: 300px;
      margin: 0 16px 16px 0;
      opacity: 0.95;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .modal {
      background: var(--color-background-primary);
      border-radius: var(--border-radius-lg);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      width: 480px;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      transition: width 0.15s, opacity 0.15s;
    }
    .modal-header {
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-title {
      font-size: 14px;
      font-weight: 500;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-footer {
      padding: 10px 16px;
      border-top: 0.5px solid var(--color-border-tertiary);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .modal-field-row {
      display: flex;
      gap: 10px;
    }
    .modal-field-row > .modal-field { flex: 1; }
    .modal-label {
      font-size: 11px;
      color: var(--color-text-secondary);
    }
    .modal-label .required { color: var(--color-text-error); }
    .modal input[type="text"],
    .modal input[type="date"] {
      font-size: 13px;
      padding: 6px 10px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      font-family: inherit;
      width: 100%;
      color: var(--color-text-primary);
    }
    .modal input[type="text"]:focus,
    .modal input[type="date"]:focus,
    .modal textarea:focus {
      outline: none;
      border-color: var(--color-border-info);
    }
    .modal textarea {
      font-size: 13px;
      padding: 6px 10px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      font-family: inherit;
      width: 100%;
      color: var(--color-text-primary);
      resize: vertical;
      min-height: 64px;
    }

    /* 検索結果ドロップダウン */
    .search-area { position: relative; }
    .search-result-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      margin-top: 2px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .search-result-list[hidden] { display: none; }
    .search-result-item {
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      line-height: 1.4;
    }
    .search-result-item:hover { background: var(--color-background-secondary); }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-loading,
    .search-result-empty {
      padding: 10px;
      font-size: 11px;
      color: var(--color-text-secondary);
      text-align: center;
    }

    /* 追加済み訪問場所リスト */
    .place-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .place-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      font-size: 12px;
    }
    .place-item-name {
      flex: 1;
      word-break: break-word;
    }
    .place-item-remove {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .place-item-remove:hover {
      background: var(--color-background-primary);
      color: var(--color-text-error);
    }

    .form-error {
      font-size: 11px;
      color: var(--color-text-error);
      padding: 4px 8px;
      background: var(--color-background-error);
      border: 0.5px solid var(--color-border-error);
      border-radius: var(--border-radius-md);
    }
    .form-error[hidden] { display: none; }

    /* ===== マルチセレクト（Notion 型ドロップダウン）===== */
    /* 3 プロパティ（transport / companions / tags）で共通使用。data-category で識別 */
    .multiselect { position: relative; }
    .multiselect-field {
      min-height: 32px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      padding: 4px 6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      cursor: text;
      background: var(--color-background-primary);
    }
    .multiselect-field:focus-within {
      border-color: var(--color-border-info);
    }
    .multiselect-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      padding: 2px 2px 2px 8px;
      border-radius: 20px;
      border: 0.5px solid var(--color-border-tertiary);
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      line-height: 1.4;
    }
    .multiselect[data-category="transport"] .multiselect-chip {
      background: var(--color-background-info);
      color: var(--color-text-info);
      border-color: var(--color-border-info);
    }
    .multiselect[data-category="companions"] .multiselect-chip {
      background: var(--color-background-success);
      color: var(--color-text-success);
      border-color: var(--color-border-success);
    }
    .multiselect[data-category="tags"] .multiselect-chip {
      background: var(--color-background-tag);
      color: var(--color-text-tag);
      border-color: var(--color-border-tag);
    }
    .multiselect-chip-remove {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0 4px;
      font-size: 14px;
      line-height: 1;
      color: inherit;
      opacity: 0.65;
      border-radius: 50%;
    }
    .multiselect-chip-remove:hover { opacity: 1; }
    .multiselect-input {
      flex: 1;
      min-width: 80px;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      padding: 2px 4px;
      font-family: inherit;
      color: var(--color-text-primary);
    }
    .multiselect-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 2px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      max-height: 200px;
      overflow-y: auto;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .multiselect-dropdown[hidden] { display: none; }
    .multiselect-option {
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-primary);
    }
    .multiselect-option:hover,
    .multiselect-option.active {
      background: var(--color-background-secondary);
    }
    .multiselect-option-label {
      flex: 1;
      word-break: break-word;
    }
    .multiselect-option-check {
      font-size: 11px;
      color: var(--color-text-info);
    }
    /* 値プール削除ボタン。option ホバー時のみ表示 */
    .multiselect-option-delete {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      color: var(--color-text-secondary);
      opacity: 0;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: -4px;
      flex-shrink: 0;
    }
    .multiselect-option:hover .multiselect-option-delete,
    .multiselect-option.active .multiselect-option-delete {
      opacity: 0.5;
    }
    .multiselect-option-delete:hover {
      opacity: 1 !important;
      background: var(--color-background-error);
      color: var(--color-text-error);
    }
    .multiselect-add {
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      border-top: 0.5px solid var(--color-border-tertiary);
      color: var(--color-text-info);
      background: var(--color-background-primary);
    }
    .multiselect-add:hover,
    .multiselect-add.active {
      background: var(--color-background-info);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左パネル：旅行一覧 -->
    <aside class="left" aria-label="旅行一覧">
      <div class="left-toolbar">
        <span class="left-toolbar-title">Tabibako</span>
        <button class="icon-btn" id="sort-btn" type="button" title="ソート" aria-label="ソート">
          <i class="ti ti-arrows-sort" style="font-size:14px" aria-hidden="true"></i>
        </button>
        <button class="icon-btn" id="add-btn" type="button" title="旅行を追加" aria-label="旅行を追加">
          <i class="ti ti-plus" style="font-size:14px" aria-hidden="true"></i>
        </button>
      </div>

      <div class="trip-list" id="trip-list">
        <div class="trip-list-empty">
          まだ旅行が登録されていません。<br />
          ＋ボタンから追加できるようになります。
        </div>
      </div>
    </aside>

    <!-- 中央パネル：地図 -->
    <main class="center" aria-label="地図">
      <div id="map"></div>

      <!-- 左上：ピン数表示（地図に実際に表示されているピンの数） -->
      <div class="map-pin-count" id="pin-count">
        <i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i>
        <span><span id="pin-count-value">0</span>か所</span>
      </div>

      <!-- 右上：ヒートマップ切替（Sprint 6 で機能実装） -->
      <button class="map-heatmap-btn" id="heatmap-btn" type="button">
        <i class="ti ti-flame" style="font-size:13px" aria-hidden="true"></i>

      <!-- 中央上：地図ピックモード時の案内バナー -->

        <span>地図をクリックして訪問場所を追加（Esc でキャンセル）</span>

    <!-- 右パネル：旅行詳細 -->
    <aside class="right" aria-label="旅行詳細">
      <div class="photo-viewer">

      </div>
      <div class="detail-body" id="detail-body">
        <div class="detail-empty">
          旅行を選択すると、<br />ここに詳細が表示されます。
        </div>

      <div class="detail-footer">
        <button class="btn-sm" type="button" disabled>
          <i class="ti ti-edit" style="font-size:11px" aria-hidden="true"></i> 編集
        </button>
        <button class="btn-sm" type="button" disabled>
          <i class="ti ti-trash" style="font-size:11px" aria-hidden="true"></i> 削除
        </button>
      </div>

  <!-- 旅行登録モーダル -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">旅行を追加</span>
        <button class="icon-btn" id="modal-close-btn" type="button" aria-label="閉じる">
          <i class="ti ti-x" style="font-size:14px" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label class="modal-label" for="trip-name">旅行名 <span class="required">*</span></label>
          <input type="text" id="trip-name" placeholder="春の京都旅" maxlength="100" />
        </div>
        <div class="modal-field-row">
          <div class="modal-field">
            <label class="modal-label" for="trip-start">開始日 <span class="required">*</span></label>
            <input type="date" id="trip-start" />
          </div>
          <div class="modal-field">
            <label class="modal-label" for="trip-end">終了日 <span class="required">*</span></label>
            <input type="date" id="trip-end" />

        </div>
        <div class="modal-field">
          <label class="modal-label">訪問場所</label>
          <div class="search-area">
            <input type="text" id="place-search" placeholder="住所・地名で検索（例: 清水寺）" autocomplete="off" />
            <div class="search-result-list" id="search-results" hidden></div>
          </div>
          <button class="btn-sm" id="map-pick-btn" type="button" style="margin-top:6px; align-self:flex-start;">
            <i class="ti ti-map-pin-plus" style="font-size:13px" aria-hidden="true"></i>
            地図から選ぶ
          </button>
          <div class="place-list" id="place-list"></div>

        <div class="modal-field">
          <label class="modal-label">移動手段</label>
          <div class="multiselect" data-category="transport"></div>
        </div>
        <div class="modal-field">
          <label class="modal-label">同行者</label>
          <div class="multiselect" data-category="companions"></div>
        </div>
        <div class="modal-field">
          <label class="modal-label" for="trip-accommodation">宿泊所</label>
          <input type="text" id="trip-accommodation" placeholder="例: ABC ホテル" maxlength="100" />

          <label class="modal-label">タグ</label>
          <div class="multiselect" data-category="tags"></div>
        </div>

          <label class="modal-label" for="trip-memo">メモ</label>
          <textarea id="trip-memo" rows="3" placeholder="旅の自由メモ" maxlength="2000"></textarea>

      <div class="modal-footer">
        <button class="btn-sm" id="modal-cancel-btn" type="button">キャンセル</button>
        <button class="btn-primary" id="modal-save-btn" type="button">保存</button>
      </div>

  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'tabibako_trips';
      const MAP_DEFAULT_VIEW = { center: [36.5, 138.0], zoom: 5 };
      const NOMINATIM_BASE = 'https://nominatim.openstreetmap.org';
      const NOMINATIM_MIN_INTERVAL_MS = 1000; // 公式利用規約：1 req/sec
      const SEARCH_DEBOUNCE_MS = 500;

      const App = {
        state: {
          trips: [],
          draft: null,             // モーダルで編集中の旅行データ
          pickMode: false,         // 地図クリックで場所追加モード
          selectedTripId: null,    // 左パネルで選択中の旅行 ID（null = 未選択）
        },
        map: null,
        draftMarkers: [],
        selectedTripMarkers: [],
        el: {},
        _lastApiRequestAt: 0,
        _throttleChain: Promise.resolve(),
        _searchRequestId: 0,

        async init() {
          this.cacheElements();
          this.storage.load();
          await this.photoDB.init();
          this.bindEvents();
          this.mapInit();
          this.renderTripList();
        },

        cacheElements() {
          const ids = [
            'add-btn', 'trip-list', 'pin-count-value', 'detail-body',
            'modal-backdrop', 'modal-close-btn', 'modal-cancel-btn', 'modal-save-btn',
            'trip-name', 'trip-start', 'trip-end',
            'trip-accommodation', 'trip-memo',
            'place-search', 'search-results', 'place-list', 'map-pick-btn',
            'pick-mode-banner', 'form-error',
          ];
          ids.forEach(id => { this.el[id] = document.getElementById(id); });
        },

        bindEvents() {
          this.el['add-btn'].addEventListener('click', () => this.modalOpen());
          this.el['modal-close-btn'].addEventListener('click', () => this.modalClose());
          this.el['modal-cancel-btn'].addEventListener('click', () => this.modalClose());
          this.el['modal-save-btn'].addEventListener('click', () => this.modalSave());
          this.el['map-pick-btn'].addEventListener('click', () => this.setPickMode(true));

          // 旅行カードのクリック（event delegation: 動的に追加されるカードに自動対応）
          this.el['trip-list'].addEventListener('click', (e) => {
            const card = e.target.closest('.trip-card');
            if (!card) return;
            this.selectTrip(card.dataset.tripId);
          });

          // 旅行カードのキーボード操作（Enter / Space で選択 toggle）
          this.el['trip-list'].addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest('.trip-card');
            if (!card) return;
            e.preventDefault();
            this.selectTrip(card.dataset.tripId);
          });

          // 住所検索（debounce）。空入力時は pending 中の検索も無効化
          this.el['place-search'].addEventListener('input', this.debounce(() => {
            const q = this.el['place-search'].value.trim();
            if (q) {
              this.searchAddress(q);
            } else {
              this._searchRequestId++;
              this.renderSearchResults(null);
            }
          }, SEARCH_DEBOUNCE_MS));

          // Esc：ピックモード解除 or モーダル閉じる
          document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (this.state.pickMode) this.setPickMode(false);
            else if (!this.el['modal-backdrop'].hidden) this.modalClose();
          });

          // 背景クリックで閉じる（ピックモード中は無効）
          this.el['modal-backdrop'].addEventListener('click', (e) => {
            if (e.target === this.el['modal-backdrop'] && !this.state.pickMode) {
              this.modalClose();
            }
          });
        },

        // ===== Map =====
        mapInit() {
          this.map = L.map('map', {
            center: MAP_DEFAULT_VIEW.center,
            zoom: MAP_DEFAULT_VIEW.zoom,
            zoomControl: false,
            worldCopyJump: true,
          });
          L.control.zoom({ position: 'bottomright' }).addTo(this.map);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          }).addTo(this.map);
          this.map.on('click', (e) => this.onMapClick(e));
        },

        async onMapClick(e) {
          if (!this.state.pickMode) return;
          const { lat, lng } = e.latlng;
          this.setPickMode(false);

          let name = '';
          try {
            name = await this.reverseGeocode(lat, lng);
          } catch (err) {
            console.warn('逆引きに失敗しました', err);
          }
          this.addPlaceToDraft({
            name: name || `(${lat.toFixed(4)}, ${lng.toFixed(4)})`,
            lat,
            lng,
          });
        },

        renderDraftPins() {
          this.draftMarkers.forEach(m => this.map.removeLayer(m));
          this.draftMarkers = [];
          const places = this.state.draft?.places || [];
          places.forEach(p => {
            const marker = L.marker([p.lat, p.lng], { icon: this.createPinIcon() })
              .bindPopup(this.escape(p.name))
              .addTo(this.map);
            this.draftMarkers.push(marker);
          });
          this.renderPinCount();
        },

        // 選択中の旅行の訪問場所をピン表示。renderDraftPins と同じピン意匠だが
        // 別レイヤーで管理（draft 追加中も選択中の旅行ピンは残せる）
        renderSelectedTripPins() {
          this.selectedTripMarkers.forEach(m => this.map.removeLayer(m));
          this.selectedTripMarkers = [];
          const trip = this.getSelectedTrip();
          if (trip) {
            trip.places.forEach(p => {
              const marker = L.marker([p.lat, p.lng], { icon: this.createPinIcon() })
                .bindPopup(this.escape(p.name))
                .addTo(this.map);
              this.selectedTripMarkers.push(marker);
            });
          }
          this.renderPinCount();
        },

        // 地図に表示されているピン数を反映。draft + 選択中の旅行を合算
        renderPinCount() {
          this.el['pin-count-value'].textContent =
            this.draftMarkers.length + this.selectedTripMarkers.length;
        },

        // Tabler Icon ベースのカスタムピン。標準マーカー画像の CDN/CORS 問題を回避し
        // プロジェクトのアイコンシステムとも統一する
        createPinIcon() {
          return L.divIcon({
            className: 'tabibako-pin',
            html: '<i class="ti ti-map-pin-filled" aria-hidden="true"></i>',
            iconSize: [32, 32],
            iconAnchor: [16, 30],
            popupAnchor: [0, -28],
          });
        },

        // ===== Nominatim API =====
        // 並行呼び出しを Promise チェーンで直列化し、確実に 1 req/sec を守る。
        // 直前リンクの拒否は無視（throttle 自体は失敗しない設計）
        async _throttle() {
          const next = this._throttleChain.then(async () => {
            const wait = Math.max(0, NOMINATIM_MIN_INTERVAL_MS - (Date.now() - this._lastApiRequestAt));
            if (wait > 0) await new Promise(r => setTimeout(r, wait));
            this._lastApiRequestAt = Date.now();
          });
          this._throttleChain = next.catch(() => {});
          return next;
        },

        // request ID で「最新の検索だけを反映」する。debounce + throttle の合間に
        // 入力が変化した場合、古いレスポンスを無視する
        async searchAddress(query) {
          const myRequestId = ++this._searchRequestId;
          this.renderSearchResults('loading');
          await this._throttle();
          if (myRequestId !== this._searchRequestId) return;
          try {
            const url = `${NOMINATIM_BASE}/search?q=${encodeURIComponent(query)}&format=json&accept-language=ja&limit=5`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (myRequestId !== this._searchRequestId) return;
            this.renderSearchResults(data);
          } catch (err) {
            if (myRequestId !== this._searchRequestId) return;
            console.error('住所検索に失敗しました', err);
            this.renderSearchResults([]);
          }
        },

        async reverseGeocode(lat, lng) {
          await this._throttle();
          const url = `${NOMINATIM_BASE}/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          return data.display_name || '';
        },

        // ===== Modal =====
        modalOpen() {
          this.state.draft = this.createBlankTrip();
          this.el['trip-name'].value = '';
          this.el['trip-start'].value = '';
          this.el['trip-end'].value = '';
          this.el['trip-accommodation'].value = '';
          this.el['trip-memo'].value = '';
          this.el['place-search'].value = '';
          this.el['form-error'].hidden = true;
          this.renderSearchResults(null);
          this.renderPlaceList();
          this.renderDraftPins();
          this.multiSelect.resetAndRenderAll();
          this.el['modal-backdrop'].hidden = false;
          this.el['trip-name'].focus();
        },

        modalClose() {
          this.setPickMode(false);
          this.el['modal-backdrop'].hidden = true;
          this.state.draft = null;
          this.renderDraftPins();
        },

        modalSave() {
          const draft = this.state.draft;
          if (!draft) return;
          draft.name = this.el['trip-name'].value.trim();
          draft.startDate = this.el['trip-start'].value;
          draft.endDate = this.el['trip-end'].value;
          draft.accommodation = this.el['trip-accommodation'].value.trim();
          draft.memo = this.el['trip-memo'].value.trim();
          // transport / companions / tags は multiSelect が draft.* に直接書き込み済み

          const error = this.validateDraft(draft);
          if (error) {
            this.el['form-error'].textContent = error;
            this.el['form-error'].hidden = false;
            return;
          }

          this.state.trips.push(draft);
          this.storage.save();
          this.renderTripList();
          this.modalClose();
        },

        validateDraft(draft) {
          if (!draft.name) return '旅行名を入力してください';
          if (!draft.startDate) return '開始日を入力してください';
          if (!draft.endDate) return '終了日を入力してください';
          if (draft.startDate > draft.endDate) return '終了日は開始日以降にしてください';
          // 訪問場所は任意（仕様書では必須だが、Sprint 4 で UX 柔軟性のため任意化）
          return null;
        },

        createBlankTrip() {
          return {
            id: crypto.randomUUID(),
            name: '',
            startDate: '',
            endDate: '',
            places: [],
            prefectures: [],   // Sprint 5 で自動判定
            accommodation: '', // Sprint 4
            transport: [],     // Sprint 4
            companions: [],    // Sprint 4
            tags: [],          // Sprint 4
            memo: '',          // Sprint 4
            photos: [],        // Sprint 4
          };
        },

        // ===== Trip Selection =====
        // 同じ ID をもう一度クリックで解除（toggle）。pin / 右パネルは Task #3/#5 で連動
        selectTrip(tripId) {
          this.state.selectedTripId = (this.state.selectedTripId === tripId) ? null : tripId;
          this.renderTripList();
          this.renderSelectedTripPins();
          this.renderTripDetail();
        },

        getSelectedTrip() {
          if (!this.state.selectedTripId) return null;
          return this.state.trips.find(t => t.id === this.state.selectedTripId) || null;
        },

        // ===== Pick Mode =====
        setPickMode(on) {
          this.state.pickMode = on;
          document.body.classList.toggle('pick-mode', on);
          this.el['modal-backdrop'].classList.toggle('pick-mode', on);
          this.el['pick-mode-banner'].hidden = !on;
        },

        // ===== Draft places =====
        addPlaceToDraft(place) {
          if (!this.state.draft) return;
          this.state.draft.places.push(place);
          this.el['place-search'].value = '';
          this.renderSearchResults(null);
          this.renderPlaceList();
          this.renderDraftPins();
        },

        removePlaceFromDraft(index) {
          if (!this.state.draft) return;
          this.state.draft.places.splice(index, 1);
          this.renderPlaceList();
          this.renderDraftPins();
        },

        // ===== Storage =====
        storage: {
          load() {
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              App.state.trips = raw ? JSON.parse(raw) : [];
            } catch (err) {
              console.error('localStorage の読み込みに失敗', err);
              App.state.trips = [];
            }
          },
          save() {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state.trips));
            } catch (err) {
              console.error('localStorage の書き込みに失敗', err);
              alert('保存に失敗しました（localStorage の容量制限の可能性があります）');
            }
          },
        },

        // ===== Photo Storage (IndexedDB) =====
        // 写真本体は localStorage の容量上限 (~5MB) では足りないため IDB に分離。
        // 旅行データの photos は { id } の参照のみで、本体は photos ストアに格納
        photoDB: {
          DB_NAME: 'tabibako',
          DB_VERSION: 1,
          STORE: 'photos',
          _db: null,

          init() {
            return new Promise((resolve, reject) => {
              const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);
              request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(this.STORE)) {
                  db.createObjectStore(this.STORE, { keyPath: 'id' });
                }
              };
              request.onsuccess = (e) => {
                this._db = e.target.result;
                resolve();
              };
              request.onerror = (e) => {
                console.error('IndexedDB の初期化に失敗', e.target.error);
                reject(e.target.error);
              };
            });
          },

          // photo: { id, dataURL, createdAt }
          put(photo) {
            return new Promise((resolve, reject) => {
              const tx = this._db.transaction(this.STORE, 'readwrite');
              const req = tx.objectStore(this.STORE).put(photo);
              req.onsuccess = () => resolve(photo.id);
              req.onerror = (e) => reject(e.target.error);
            });
          },

          get(id) {
            return new Promise((resolve, reject) => {
              const tx = this._db.transaction(this.STORE, 'readonly');
              const req = tx.objectStore(this.STORE).get(id);
              req.onsuccess = () => resolve(req.result || null);
              req.onerror = (e) => reject(e.target.error);
            });
          },

          getMany(ids) {
            return Promise.all(ids.map(id => this.get(id)));
          },

          delete(id) {
            return new Promise((resolve, reject) => {
              const tx = this._db.transaction(this.STORE, 'readwrite');
              const req = tx.objectStore(this.STORE).delete(id);
              req.onsuccess = () => resolve();
              req.onerror = (e) => reject(e.target.error);
            });
          },
        },

        // ===== マルチセレクト UI（Notion 型ドロップダウン）=====
        // 3 プロパティ（transport / companions / tags）で UI を共有、値プールは独立
        multiSelect: {
          POOL_KEYS: {
            transport: 'tabibako_transport_pool',
            companions: 'tabibako_companions_pool',
            tags: 'tabibako_tags_pool',
          },
          POOL_DEFAULTS: {
            transport: ['徒歩', '自転車', '車', '電車', 'バス', '飛行機', '船'],
            companions: [],
            tags: [],
          },
          CATEGORIES: ['transport', 'companions', 'tags'],
          PLACEHOLDERS: {
            transport: '移動手段を追加',
            companions: '同行者を追加',
            tags: 'タグを追加',
          },

          // category → { open, query, activeIndex }
          _ui: {},
          _eventsBound: false,

          getPool(category) {
            try {
              const raw = localStorage.getItem(this.POOL_KEYS[category]);
              if (raw) return JSON.parse(raw);
            } catch (err) {
              console.error('値プール読み込み失敗', err);
            }
            return [...this.POOL_DEFAULTS[category]];
          },

          savePool(category, pool) {
            try {
              localStorage.setItem(this.POOL_KEYS[category], JSON.stringify(pool));
            } catch (err) {
              console.error('値プール保存失敗', err);
            }
          },

          // draft 上の選択中の値
          getSelected(category) {
            return App.state.draft?.[category] || [];
          },

          setSelected(category, values) {
            if (App.state.draft) App.state.draft[category] = values;
          },

          // 全カテゴリの UI 状態リセットと再描画。モーダル開閉時に呼ぶ
          resetAndRenderAll() {
            this.CATEGORIES.forEach(cat => {
              this._ui[cat] = { open: false, query: '', activeIndex: -1 };
              this.render(cat);
            });
            if (!this._eventsBound) {
              this.bindEvents();
              this._eventsBound = true;
            }
          },

          // 候補リスト（プール - 選択済み）を query でフィルター
          filteredOptions(category) {
            const pool = this.getPool(category);
            const selected = this.getSelected(category);
            const q = (this._ui[category]?.query || '').trim().toLowerCase();
            const remaining = pool.filter(v => !selected.includes(v));
            if (!q) return remaining;
            return remaining.filter(v => v.toLowerCase().includes(q));
          },

          // 「+ "xxx" を新規追加」が表示されるかの判定
          canAddNew(category) {
            const q = (this._ui[category]?.query || '').trim();
            if (!q) return false;
            const pool = this.getPool(category);
            const selected = this.getSelected(category);
            // プールにも選択済みにも一致しないときのみ
            return !pool.includes(q) && !selected.includes(q);
          },

          render(category) {
            const root = document.querySelector(`.multiselect[data-category="${category}"]`);
            if (!root) return;
            const ui = this._ui[category] || { open: false, query: '', activeIndex: -1 };
            const selected = this.getSelected(category);

            const chips = selected.map(v => `
              <span class="multiselect-chip">${App.escape(v)}<button class="multiselect-chip-remove" type="button" data-value="${App.escape(v)}" aria-label="削除">×</button></span>
            `).join('');

            const inputHtml = `
              <input class="multiselect-input" type="text" autocomplete="off"
                     placeholder="${App.escape(this.PLACEHOLDERS[category])}" value="${App.escape(ui.query)}" />
            `;

            let dropdownHtml = '';
            if (ui.open) {
              const options = this.filteredOptions(category);
              const optionsHtml = options.map((v, i) => `
                <div class="multiselect-option${i === ui.activeIndex ? ' active' : ''}" data-value="${App.escape(v)}" data-index="${i}">
                  <span class="multiselect-option-label">${App.escape(v)}</span>
                  <button class="multiselect-option-delete" type="button" data-pool-value="${App.escape(v)}" aria-label="候補から削除" title="候補から削除">×</button>
                </div>
              `).join('');
              const addNewIndex = options.length;
              const addNewHtml = this.canAddNew(category) ? `
                <div class="multiselect-add${addNewIndex === ui.activeIndex ? ' active' : ''}" data-index="${addNewIndex}">+ "${App.escape(ui.query.trim())}" を新規追加</div>
              ` : '';
              const emptyHtml = (options.length === 0 && !this.canAddNew(category)) ? `
                <div class="multiselect-option" style="cursor:default;color:var(--color-text-secondary)">候補がありません</div>
              ` : '';
              dropdownHtml = `<div class="multiselect-dropdown">${optionsHtml}${addNewHtml || emptyHtml}</div>`;
            } else {
              dropdownHtml = `<div class="multiselect-dropdown" hidden></div>`;
            }

            root.innerHTML = `
              <div class="multiselect-field">${chips}${inputHtml}</div>
              ${dropdownHtml}
            `;

            // 描画後にフォーカス復元（dropdown を開いた直後など）
            if (ui.open) {
              const input = root.querySelector('.multiselect-input');
              if (input && document.activeElement !== input) {
                input.focus();
                // カーソルを末尾に
                const len = input.value.length;
                input.setSelectionRange(len, len);
              }
            }
          },

          open(category) {
            const ui = this._ui[category] || {};
            ui.open = true;
            ui.activeIndex = -1;
            this._ui[category] = ui;
            this.render(category);
          },

          close(category) {
            if (this._ui[category]) {
              this._ui[category].open = false;
              this._ui[category].query = '';
              this._ui[category].activeIndex = -1;
            }
            this.render(category);
          },

          // 値の選択/解除トグル
          toggleValue(category, value) {
            const selected = this.getSelected(category);
            const idx = selected.indexOf(value);
            if (idx >= 0) selected.splice(idx, 1);
            else selected.push(value);
            this.setSelected(category, [...selected]);
            // 選択後も dropdown は開いたまま、検索クエリはリセット
            if (this._ui[category]) this._ui[category].query = '';
            this.render(category);
          },

          addNewAndSelect(category, value) {
            const trimmed = value.trim();
            if (!trimmed) return;
            const pool = this.getPool(category);
            if (!pool.includes(trimmed)) {
              pool.push(trimmed);
              this.savePool(category, pool);
            }
            const selected = this.getSelected(category);
            if (!selected.includes(trimmed)) {
              selected.push(trimmed);
              this.setSelected(category, [...selected]);
            }
            if (this._ui[category]) {
              this._ui[category].query = '';
              this._ui[category].activeIndex = -1;
            }
            this.render(category);
          },

          // チップ × での削除（選択中の draft から外す）
          removeValue(category, value) {
            const selected = this.getSelected(category).filter(v => v !== value);
            this.setSelected(category, selected);
            this.render(category);
          },

          // 候補ホバー時の × で「値プール」から完全削除（過去の選択値を整理）
          // 保存済みの旅行データには影響しない（仕様書「将来対応」の前倒し実装）
          deleteFromPool(category, value) {
            const pool = this.getPool(category).filter(v => v !== value);
            this.savePool(category, pool);
            // 現在 draft で選択中なら外す
            const selected = this.getSelected(category).filter(v => v !== value);
            this.setSelected(category, selected);
            this.render(category);
          },

          // ↑↓ で activeIndex 移動
          moveActive(category, delta) {
            const ui = this._ui[category];
            if (!ui || !ui.open) return;
            const optionsCount = this.filteredOptions(category).length;
            const total = optionsCount + (this.canAddNew(category) ? 1 : 0);
            if (total === 0) return;
            let next = ui.activeIndex + delta;
            if (next < 0) next = total - 1;
            if (next >= total) next = 0;
            ui.activeIndex = next;
            this.render(category);
          },

          // Enter で active な候補を選択（または add）
          confirmActive(category) {
            const ui = this._ui[category];
            if (!ui || !ui.open) return;
            const options = this.filteredOptions(category);
            const optionsCount = options.length;
            const addAvailable = this.canAddNew(category);

            if (ui.activeIndex < 0) {
              // active 候補なし。query が新規値として追加可能ならそれを採用
              if (addAvailable) {
                this.addNewAndSelect(category, ui.query.trim());
              }
              return;
            }
            if (ui.activeIndex < optionsCount) {
              this.toggleValue(category, options[ui.activeIndex]);
              return;
            }
            if (ui.activeIndex === optionsCount && addAvailable) {
              this.addNewAndSelect(category, ui.query.trim());
            }
          },

          // 共通イベントバインド（初回のみ）
          bindEvents() {
            this.CATEGORIES.forEach(cat => {
              const root = document.querySelector(`.multiselect[data-category="${cat}"]`);
              if (!root) return;

              // クリック処理を 1 ハンドラに統合し、必ず stopPropagation で document まで伝播させない。
              // 伝播させると、render() で DOM が差し替わった後の e.target が detached になり、
              // 後段の「外クリックで閉じる」ハンドラが closest() で null を返して誤って close() を呼ぶ
              root.addEventListener('click', (e) => {
                e.stopPropagation();
                const removeBtn = e.target.closest('.multiselect-chip-remove');
                if (removeBtn) {
                  this.removeValue(cat, removeBtn.dataset.value);
                  return;
                }
                // 候補の × は「値プールから削除」（option click より先に判定）
                const poolDeleteBtn = e.target.closest('.multiselect-option-delete');
                if (poolDeleteBtn) {
                  const value = poolDeleteBtn.dataset.poolValue;
                  if (confirm(`候補から「${value}」を削除しますか？\n（保存済みの旅行データはそのまま残ります）`)) {
                    this.deleteFromPool(cat, value);
                  }
                  return;
                }
                const opt = e.target.closest('.multiselect-option');
                if (opt && opt.dataset.value) {
                  this.toggleValue(cat, opt.dataset.value);
                  return;
                }
                const add = e.target.closest('.multiselect-add');
                if (add) {
                  const q = (this._ui[cat]?.query || '').trim();
                  if (q) this.addNewAndSelect(cat, q);
                  return;
                }
                if (e.target.closest('.multiselect-field')) {
                  this.open(cat);
                }
              });

              // 入力イベント。IME 確定前（e.isComposing）は再描画しない。
              // 再描画すると input 要素ごと差し替わって IME の composition 状態が失われ、
              // 「sa」と打って「さ」に変換されるはずが「sあ」のような壊れた表示になる
              root.addEventListener('input', (e) => {
                if (!e.target.matches('.multiselect-input')) return;
                if (e.isComposing) return;
                const ui = this._ui[cat];
                if (!ui) return;
                ui.query = e.target.value;
                ui.activeIndex = -1;
                ui.open = true;
                this.render(cat);
              });

              // IME 確定完了後、最終的な確定値で再描画
              root.addEventListener('compositionend', (e) => {
                if (!e.target.matches('.multiselect-input')) return;
                const ui = this._ui[cat];
                if (!ui) return;
                ui.query = e.target.value;
                ui.activeIndex = -1;
                ui.open = true;
                this.render(cat);
              });

              root.addEventListener('keydown', (e) => {
                if (!e.target.matches('.multiselect-input')) return;
                // IME 変換中の Enter / Escape / ArrowDown は IME 側に渡す
                if (e.isComposing) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); this.moveActive(cat, 1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); this.moveActive(cat, -1); }
                else if (e.key === 'Enter') { e.preventDefault(); this.confirmActive(cat); }
                else if (e.key === 'Escape') { e.preventDefault(); this.close(cat); }
                else if (e.key === 'Backspace' && e.target.value === '') {
                  const selected = this.getSelected(cat);
                  if (selected.length > 0) {
                    e.preventDefault();
                    this.removeValue(cat, selected[selected.length - 1]);
                  }
                }
              });
            });

            // 外クリックで開いている multiselect をすべて閉じる
            // （multiselect 内のクリックは上の stopPropagation でここに来ない）
            document.addEventListener('click', () => {
              this.CATEGORIES.forEach(cat => {
                if (this._ui[cat]?.open) this.close(cat);
              });
            });
          },
        },

        // ===== Rendering =====
        renderTripList() {
          const container = this.el['trip-list'];
          const trips = this.state.trips;
          if (trips.length === 0) {
            container.innerHTML = `
              <div class="trip-list-empty">
                まだ旅行が登録されていません。<br />
                ＋ボタンから追加できるようになります。
              </div>
            `;
            return;
          }
          const selectedId = this.state.selectedTripId;
          container.innerHTML = trips.map(trip => {
            const isSelected = trip.id === selectedId;
            const allTags = [
              ...(trip.transport || []).map(v => ({ value: v, kind: 'transport' })),
              ...(trip.companions || []).map(v => ({ value: v, kind: 'companions' })),
              ...(trip.tags || []).map(v => ({ value: v, kind: 'tags' })),
            ];
            const tagsHtml = allTags.length > 0 ? `
              <div class="trip-card-tags">
                ${allTags.map(t => `<span class="trip-card-tag trip-card-tag-${t.kind}">${this.escape(t.value)}</span>`).join('')}
              </div>` : '';
            return `
            <div class="trip-card${isSelected ? ' selected' : ''}" data-trip-id="${this.escape(trip.id)}"
                 role="button" tabindex="0" aria-pressed="${isSelected ? 'true' : 'false'}">
              <div class="trip-card-name">${this.escape(trip.name)}</div>
              <div class="trip-card-meta">
                <div class="trip-card-meta-row">
                  <i class="ti ti-calendar" style="font-size:11px" aria-hidden="true"></i>
                  <span>${this.escape(trip.startDate)} 〜 ${this.escape(trip.endDate)}</span>
                </div>
                <div class="trip-card-meta-row">
                  <i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i>
                  <span>訪問場所 ${trip.places.length} か所</span>
                </div>
              </div>
              ${tagsHtml}
            </div>
          `;
          }).join('');
        },

        // 右パネル詳細：選択中の旅行の情報を描画。Sprint 4 で transport/companions/memo/photos 追加
        renderTripDetail() {
          const container = this.el['detail-body'];
          const trip = this.getSelectedTrip();
          if (!trip) {
            container.innerHTML = `
              <div class="detail-empty">
                旅行を選択すると、<br />ここに詳細が表示されます。
              </div>
            `;
            return;
          }
          const placeListHtml = trip.places.map(p => `
            <li class="detail-place-item">
              <i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i>
              <span>${this.escape(p.name)}</span>
            </li>
          `).join('');
          container.innerHTML = `
            <div class="detail-content">
              <h2 class="detail-title">${this.escape(trip.name)}</h2>
              <div class="detail-section">
                <div class="detail-section-label">日程</div>
                <div class="detail-section-value">
                  ${this.escape(trip.startDate)} 〜 ${this.escape(trip.endDate)}
                </div>
              </div>
              <div class="detail-section">
                <div class="detail-section-label">訪問場所（${trip.places.length} か所）</div>
                <ul class="detail-place-list">${placeListHtml}</ul>
              </div>
            </div>
          `;
        },

        renderPlaceList() {
          const container = this.el['place-list'];
          const places = this.state.draft?.places || [];
          container.innerHTML = places.map((p, i) => `
            <div class="place-item">
              <span class="place-item-name">${this.escape(p.name)}</span>
              <button class="place-item-remove" type="button" data-index="${i}" aria-label="削除">
                <i class="ti ti-x" style="font-size:12px" aria-hidden="true"></i>
              </button>
            </div>
          `).join('');
          container.querySelectorAll('.place-item-remove').forEach(btn => {
            btn.addEventListener('click', () => {
              const idx = parseInt(btn.dataset.index, 10);
              this.removePlaceFromDraft(idx);
            });
          });
        },

        renderSearchResults(items) {
          const container = this.el['search-results'];

          if (items === null) {
            container.hidden = true;
            container.innerHTML = '';
            return;
          }
          if (items === 'loading') {
            container.hidden = false;
            container.innerHTML = '<div class="search-result-loading">検索中…</div>';
            return;
          }
          if (items.length === 0) {
            container.hidden = false;
            container.innerHTML = '<div class="search-result-empty">該当する場所が見つかりませんでした</div>';
            return;
          }
          container.hidden = false;
          container.innerHTML = items.map((item, i) => `
            <div class="search-result-item" data-index="${i}">${this.escape(item.display_name)}</div>
          `).join('');
          container.querySelectorAll('.search-result-item').forEach((el, i) => {
            el.addEventListener('click', () => {
              const item = items[i];
              this.addPlaceToDraft({
                name: item.display_name,
                lat: parseFloat(item.lat),
                lng: parseFloat(item.lon),
              });
            });
          });
        },

        // ===== Helpers =====
        debounce(fn, ms) {
          let timer;
          return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => fn(...args), ms);
          };
        },

        escape(str) {
          if (str == null) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        },
      };

      document.addEventListener('DOMContentLoaded', () => App.init());
    })();
  </script>
</body>
</html>
