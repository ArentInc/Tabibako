<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabibako（旅箱）</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <!-- Tabler Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css"
  />

  <style>
    /* ===== デザイントークン（モック v6 をベースに定義） ===== */
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f5f5f4;
      --color-background-info: #e6f1fb;
      --color-background-info-hover: #d9e9f7;
      --color-background-success: #e1f5ee;
      --color-background-tag: #eeedfe;
      --color-background-photo-placeholder: #c9d9e8;
      --color-background-error: #fef2f2;

      --color-border-secondary: #d6d3d1;
      --color-border-tertiary: #e7e5e4;
      --color-border-info: #b5d4f4;
      --color-border-success: #9fe1cb;
      --color-border-tag: #cecbf6;
      --color-border-error: #fecaca;

      --color-text-primary: #1c1917;
      --color-text-secondary: #78716c;
      --color-text-info: #0c447c;
      --color-text-success: #085041;
      --color-text-tag: #3c3489;
      --color-text-photo-placeholder: #88aabb;
      --color-text-error: #c53030;
      --color-pin-dim: #9bb0c4;
      --color-pin-selected: #e05c00;

      --border-radius-md: 6px;
      --border-radius-lg: 10px;
    }

    /* ===== ベース ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
        "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 13px;
      color: var(--color-text-primary);
      background: var(--color-background-secondary);
    }

    /* ===== アプリ全体（3カラム + リサイズハンドル 2 本 / 100vh） ===== */
    /* grid-template-columns は App.panelResize.applyWidths が動的に書き換える。
       初期値はモジュールが起動するまでの表示崩れ防止用 */
    .app {
      display: grid;
      grid-template-columns: 384px 4px 1fr 4px 390px;
      height: 100vh;
      overflow: hidden;
    }

    /* リサイズハンドル（左パネル右端と右パネル左端の 2 本） */
    .resize-handle {
      cursor: col-resize;
      background: transparent;
      transition: background 0.12s;
      user-select: none;
    }
    .resize-handle:hover,
    .resize-handle.dragging {
      background: var(--color-border-info);
    }
    /* ドラッグ中は画面全体のカーソルとテキスト選択を抑止 */
    body.resizing {
      cursor: col-resize !important;
      user-select: none !important;
    }
    body.resizing iframe { pointer-events: none; }

    /* ===== 左パネル ===== */
    .left {
      background: var(--color-background-primary);
      border-right: 0.5px solid var(--color-border-tertiary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .left-toolbar {
      padding: 8px 10px;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      position: relative;
    }
    .left-toolbar-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-primary);
      flex: 1;
    }
    .icon-btn {
      width: 26px;
      height: 26px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      color: var(--color-text-secondary);
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--color-background-secondary); }
    .icon-btn.active {
      background: var(--color-background-info);
      border-color: var(--color-border-info);
      color: var(--color-text-info);
    }
    .trip-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .trip-list-empty {
      padding: 24px 12px;
      text-align: center;
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }

    /* ===== 中央パネル（地図） ===== */
    .center {
      position: relative;
      overflow: hidden;
    }
    #map { position: absolute; inset: 0; }

    .map-pin-count {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      padding: 4px 8px;
      font-size: 11px;
      color: var(--color-text-secondary);
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* Issue #6 レビュー修正：display: flex が hidden 属性を打ち消すのを防ぐ */
    .map-pin-count[hidden] { display: none; }
    .map-heatmap-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 500;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--color-text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
    }
    .map-heatmap-btn:hover { background: var(--color-background-secondary); }
    .map-heatmap-btn.active {
      background: var(--color-background-info);
      color: var(--color-text-info);
      border-color: var(--color-border-info);
    }
    .map-heatmap-btn.active:hover { background: var(--color-background-info-hover); }

    /* Leaflet 標準のズームコントロールはモックの右下配置にあわせて調整 */
    .leaflet-bottom.leaflet-right { margin: 0 8px 12px 0; }

    /* ===== 右パネル ===== */
    .right {
      background: var(--color-background-primary);
      border-left: 0.5px solid var(--color-border-tertiary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .photo-viewer {
      height: 140px;
      flex-shrink: 0;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-background-photo-placeholder);
      color: var(--color-text-photo-placeholder);
    }
    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .detail-empty {
      padding: 24px 4px;
      text-align: center;
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .detail-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .detail-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-primary);
      word-break: break-word;
    }
    .detail-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-section-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      font-weight: 500;
    }
    .detail-section-value {
      font-size: 12px;
      color: var(--color-text-primary);
    }
    .detail-place-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .detail-place-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      font-size: 12px;
      color: var(--color-text-primary);
      word-break: break-word;
    }
    /* 右パネル詳細のカラータグ（移動手段=青 / 同行者=緑 / タグ=紫） */
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .detail-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
      line-height: 1.4;
    }
    .detail-tag-transport {
      background: var(--color-background-info);
      color: var(--color-text-info);
    }
    .detail-tag-companions {
      background: var(--color-background-success);
      color: var(--color-text-success);
    }
    .detail-tag-tags {
      background: var(--color-background-tag);
      color: var(--color-text-tag);
    }
    .detail-memo {
      font-size: 12px;
      color: var(--color-text-primary);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      padding: 6px 8px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
    }

    /* ===== 写真ビューア ===== */
    .photo-viewer-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: var(--color-background-photo-placeholder);
    }
    .photo-viewer-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .photo-viewer-arrow:hover { background: rgba(0, 0, 0, 0.75); }
    .photo-viewer-arrow-prev { left: 6px; }
    .photo-viewer-arrow-next { right: 6px; }
    .photo-viewer-counter {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      pointer-events: none;
    }
    .detail-footer {
      padding: 8px 12px;
      border-top: 0.5px solid var(--color-border-tertiary);
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-sm {
      font-size: 11px;
      padding: 4px 10px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      background: transparent;
      color: var(--color-text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-sm:hover:not(:disabled) { background: var(--color-background-secondary); }
    .btn-sm:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      font-size: 12px;
      padding: 6px 14px;
      border: 0.5px solid var(--color-border-info);
      border-radius: var(--border-radius-md);
      background: var(--color-background-info);
      color: var(--color-text-info);
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary:hover:not(:disabled) { background: var(--color-background-info-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== 絞り込み 3 セクション（左パネル）===== */
    .filter-section {
      flex-shrink: 0;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      max-height: 240px;
      overflow-y: auto;
    }
    .filter-section[hidden] { display: none; }
    .filter-group {
      padding: 6px 10px;
    }
    .filter-group + .filter-group {
      border-top: 0.5px solid var(--color-border-tertiary);
    }
    .filter-group-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }
    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .filter-chip {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 0.5px solid var(--color-border-secondary);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      user-select: none;
      line-height: 1.4;
    }
    .filter-chip:hover { background: var(--color-background-secondary); }
    .filter-group[data-category="transport"] .filter-chip.active {
      background: var(--color-background-info);
      color: var(--color-text-info);
      border-color: var(--color-border-info);
    }
    .filter-group[data-category="companions"] .filter-chip.active {
      background: var(--color-background-success);
      color: var(--color-text-success);
      border-color: var(--color-border-success);
    }
    .filter-group[data-category="tags"] .filter-chip.active {
      background: var(--color-background-tag);
      color: var(--color-text-tag);
      border-color: var(--color-border-tag);
    }
    .filter-empty {
      font-size: 10px;
      color: var(--color-text-secondary);
    }

    /* ===== ソートドロップダウン ===== */
    .sort-dropdown {
      position: absolute;
      top: 100%;
      right: 10px;
      margin-top: 4px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      z-index: 30;
      min-width: 180px;
      overflow: hidden;
    }
    .sort-dropdown[hidden] { display: none; }
    .sort-option {
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sort-option:hover { background: var(--color-background-secondary); }
    .sort-option.active {
      background: var(--color-background-info);
      color: var(--color-text-info);
      font-weight: 500;
    }
    .sort-option.active::before {
      content: '✓';
      font-size: 11px;
    }
    .sort-option:not(.active)::before {
      content: '';
      width: 11px;
    }

    /* ===== 旅行カード（左パネル）===== */
    .trip-card {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px;
      margin-bottom: 6px;
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .trip-card:hover {
      background: var(--color-background-secondary);
    }
    .trip-card.selected {
      border-color: var(--color-border-info);
      background: var(--color-background-info);
    }
    /* キーボード操作時のみフォーカスリング表示。マウスクリックでは出ない */
    .trip-card:focus-visible {
      outline: 2px solid var(--color-border-info);
      outline-offset: 1px;
    }
    /* カード内コンテンツ列（名前・メタ・タグ）。flex 子の overflow（横スクロールタグ）を許容するため min-width: 0 */
    .trip-card-body {
      flex: 1 1 auto;
      min-width: 0;
    }
    /* Issue #9: 1 枚目の写真サムネ。写真なし時は要素自体を描画しないので領域も確保しない */
    .trip-card-thumb {
      flex: 0 0 auto;
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: var(--border-radius-md);
      background: var(--color-background-secondary);
      display: block;
    }
    .trip-card-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 4px;
      word-break: break-word;
    }
    .trip-card-meta {
      font-size: 11px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .trip-card-meta-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* 旅行カード：移動手段・同行者・タグの全件横スクロール表示（Issue #2 決定通り） */
    .trip-card-tags {
      display: flex;
      flex-direction: row;
      gap: 3px;
      margin-top: 6px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 2px;
    }
    .trip-card-tags::-webkit-scrollbar { height: 4px; }
    .trip-card-tags::-webkit-scrollbar-thumb {
      background: var(--color-border-tertiary);
      border-radius: 2px;
    }
    .trip-card-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.4;
    }
    .trip-card-tag-transport {
      background: var(--color-background-info);
      color: var(--color-text-info);
    }
    .trip-card-tag-companions {
      background: var(--color-background-success);
      color: var(--color-text-success);
    }
    .trip-card-tag-tags {
      background: var(--color-background-tag);
      color: var(--color-text-tag);
    }

    /* ===== 地図ピン（Tabler Icon ベース・3 バリアント）===== */
    /* L.divIcon の親要素。.leaflet-div-icon の白背景・枠線を打ち消す */
    .tabibako-pin {
      background: transparent;
      border: none;
    }
    .tabibako-pin .ti {
      font-size: 32px;
      color: var(--color-text-info);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      line-height: 1;
    }
    /* 未選択時の全旅行ピン（変化なし、デフォルト青） */
    .tabibako-pin-default .ti { color: var(--color-text-info); }
    /* 選択時の他旅行ピン（控えめにグレー青で背景化） */
    .tabibako-pin-dim .ti { color: var(--color-pin-dim); }
    /* 選択中の旅行のピン（強調オレンジ）。
       font-size 拡大は iconAnchor がずれるため避け、影を強めて視認性を確保 */
    .tabibako-pin-selected .ti {
      color: var(--color-pin-selected);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
    /* 宿泊所ピン（緑系で訪問場所と区別） */
    .tabibako-pin-accommodation .ti { color: var(--color-text-success); }

    /* ===== 地図ピックモード ===== */
    body.pick-mode #map { cursor: crosshair; }

    /* ===== モーダル ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: background 0.15s;
    }
    .modal-backdrop[hidden] { display: none; }

    /* ピックモード中はモーダルが右下に縮小し、背景透過で地図クリック可能 */
    .modal-backdrop.pick-mode {
      background: transparent;
      align-items: flex-end;
      justify-content: flex-end;
      pointer-events: none;
    }
    .modal-backdrop.pick-mode .modal {
      pointer-events: auto;
      width: 300px;
      margin: 0 16px 16px 0;
      opacity: 0.95;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .modal {
      background: var(--color-background-primary);
      border-radius: var(--border-radius-lg);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      width: 480px;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      transition: width 0.15s, opacity 0.15s;
    }
    .modal-header {
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .modal-title {
      font-size: 14px;
      font-weight: 500;
    }
    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-footer {
      padding: 10px 16px;
      border-top: 0.5px solid var(--color-border-tertiary);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .modal-field-row {
      display: flex;
      gap: 10px;
    }
    .modal-field-row > .modal-field { flex: 1; }
    .modal-label {
      font-size: 11px;
      color: var(--color-text-secondary);
    }
    .modal-label .required { color: var(--color-text-error); }
    .modal input[type="text"],
    .modal input[type="date"] {
      font-size: 13px;
      padding: 6px 10px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      font-family: inherit;
      width: 100%;
      color: var(--color-text-primary);
    }
    .modal input[type="text"]:focus,
    .modal input[type="date"]:focus,
    .modal textarea:focus {
      outline: none;
      border-color: var(--color-border-info);
    }
    .modal textarea {
      font-size: 13px;
      padding: 6px 10px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-primary);
      font-family: inherit;
      width: 100%;
      color: var(--color-text-primary);
      resize: vertical;
      min-height: 64px;
    }

    /* 検索結果ドロップダウン */
    .search-area { position: relative; }
    .search-result-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      margin-top: 2px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .search-result-list[hidden] { display: none; }
    .search-result-item {
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 0.5px solid var(--color-border-tertiary);
      line-height: 1.4;
    }
    .search-result-item:hover { background: var(--color-background-secondary); }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-loading,
    .search-result-empty {
      padding: 10px;
      font-size: 11px;
      color: var(--color-text-secondary);
      text-align: center;
    }

    /* 追加済み訪問場所リスト */
    .place-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .place-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-md);
      font-size: 12px;
    }
    .place-item-name {
      flex: 1;
      word-break: break-word;
    }
    .place-item-remove {
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .place-item-remove:hover {
      background: var(--color-background-primary);
      color: var(--color-text-error);
    }

    .form-error {
      font-size: 11px;
      color: var(--color-text-error);
      padding: 4px 8px;
      background: var(--color-background-error);
      border: 0.5px solid var(--color-border-error);
      border-radius: var(--border-radius-md);
    }
    .form-error[hidden] { display: none; }

    /* ===== マルチセレクト（Notion 型ドロップダウン）===== */
    /* 3 プロパティ（transport / companions / tags）で共通使用。data-category で識別 */
    .multiselect { position: relative; }
    .multiselect-field {
      min-height: 32px;
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      padding: 4px 6px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      cursor: text;
      background: var(--color-background-primary);
    }
    .multiselect-field:focus-within {
      border-color: var(--color-border-info);
    }
    .multiselect-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      padding: 2px 2px 2px 8px;
      border-radius: 20px;
      border: 0.5px solid var(--color-border-tertiary);
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      line-height: 1.4;
    }
    .multiselect[data-category="transport"] .multiselect-chip {
      background: var(--color-background-info);
      color: var(--color-text-info);
      border-color: var(--color-border-info);
    }
    .multiselect[data-category="companions"] .multiselect-chip {
      background: var(--color-background-success);
      color: var(--color-text-success);
      border-color: var(--color-border-success);
    }
    .multiselect[data-category="tags"] .multiselect-chip {
      background: var(--color-background-tag);
      color: var(--color-text-tag);
      border-color: var(--color-border-tag);
    }
    .multiselect-chip-remove {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0 4px;
      font-size: 14px;
      line-height: 1;
      color: inherit;
      opacity: 0.65;
      border-radius: 50%;
    }
    .multiselect-chip-remove:hover { opacity: 1; }
    .multiselect-input {
      flex: 1;
      min-width: 80px;
      border: none;
      outline: none;
      background: transparent;
      font-size: 12px;
      padding: 2px 4px;
      font-family: inherit;
      color: var(--color-text-primary);
    }
    .multiselect-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 2px;
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      max-height: 200px;
      overflow-y: auto;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .multiselect-dropdown[hidden] { display: none; }
    .multiselect-option {
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-primary);
    }
    .multiselect-option:hover,
    .multiselect-option.active {
      background: var(--color-background-secondary);
    }
    .multiselect-option-label {
      flex: 1;
      word-break: break-word;
    }
    .multiselect-option-check {
      font-size: 11px;
      color: var(--color-text-info);
    }
    /* 値プール削除ボタン。option ホバー時のみ表示 */
    .multiselect-option-delete {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      color: var(--color-text-secondary);
      opacity: 0;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: -4px;
      flex-shrink: 0;
    }
    .multiselect-option:hover .multiselect-option-delete,
    .multiselect-option.active .multiselect-option-delete {
      opacity: 0.5;
    }
    .multiselect-option-delete:hover {
      opacity: 1 !important;
      background: var(--color-background-error);
      color: var(--color-text-error);
    }
    .multiselect-add {
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      border-top: 0.5px solid var(--color-border-tertiary);
      color: var(--color-text-info);
      background: var(--color-background-primary);
    }
    .multiselect-add:hover,
    .multiselect-add.active {
      background: var(--color-background-info);
    }

    /* ===== 写真アップロード ===== */
    .photo-upload {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .photo-upload-area {
      border: 1px dashed var(--color-border-secondary);
      border-radius: var(--border-radius-md);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      background: var(--color-background-secondary);
      transition: background 0.15s, border-color 0.15s;
      color: var(--color-text-secondary);
    }
    .photo-upload-area:hover { background: var(--color-background-info); }
    .photo-upload-area.dragging {
      background: var(--color-background-info);
      border-color: var(--color-border-info);
      color: var(--color-text-info);
    }
    .photo-upload-input { display: none; }
    .photo-upload-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 4px;
    }
    .photo-upload-list:empty { display: none; }
    .photo-upload-item {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: var(--border-radius-md);
      background: var(--color-background-secondary);
    }
    .photo-upload-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-upload-item-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }
    .photo-upload-item-remove:hover { background: var(--color-text-error); }
    .photo-upload-progress {
      font-size: 11px;
      color: var(--color-text-secondary);
      text-align: center;
    }
    .photo-upload-progress[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左パネル：旅行一覧 -->
    <aside class="left" aria-label="旅行一覧">
      <div class="left-toolbar">
        <span class="left-toolbar-title">Tabibako</span>
        <button class="icon-btn" id="sort-btn" type="button" title="ソート" aria-label="ソート" aria-haspopup="true" aria-expanded="false">
          <i class="ti ti-arrows-sort" style="font-size:14px" aria-hidden="true"></i>
        </button>
        <button class="icon-btn" id="add-btn" type="button" title="旅行を追加" aria-label="旅行を追加">
          <i class="ti ti-plus" style="font-size:14px" aria-hidden="true"></i>
        </button>
        <div class="sort-dropdown" id="sort-dropdown" role="menu" hidden></div>
      </div>

      <div class="filter-section" id="filter-section" hidden></div>

      <div class="trip-list" id="trip-list">
        <div class="trip-list-empty">
          まだ旅行が登録されていません。<br />
          ＋ボタンから追加できるようになります。
        </div>
      </div>
    </aside>

    <!-- 左パネル幅リサイズハンドル -->
    <div class="resize-handle" data-side="left" role="separator" aria-orientation="vertical"
         aria-label="左パネル幅を変更（ダブルクリックで初期値）" title="ドラッグで幅を変更（ダブルクリックで初期値）"></div>

    <!-- 中央パネル：地図 -->
    <main class="center" aria-label="地図">
      <div id="map"></div>

      <!-- 左上：ピン数表示（地図に実際に表示されているピンの数） -->
      <div class="map-pin-count" id="pin-count">
        <i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i>
        <span><span id="pin-count-value">0</span>か所</span>
      </div>

      <!-- 右上：ヒートマップ切替（Sprint 6 で機能実装） -->
      <button class="map-heatmap-btn" id="heatmap-btn" type="button"
              aria-pressed="false" aria-label="ヒートマップ表示切り替え">
        <i class="ti ti-flame" style="font-size:13px" aria-hidden="true"></i>
        <span>ヒートマップ</span>
      </button>

    </main>

    <!-- 右パネル幅リサイズハンドル -->
    <div class="resize-handle" data-side="right" role="separator" aria-orientation="vertical"
         aria-label="右パネル幅を変更（ダブルクリックで初期値）" title="ドラッグで幅を変更（ダブルクリックで初期値）"></div>

    <!-- 右パネル：旅行詳細 -->
    <aside class="right" aria-label="旅行詳細">
      <div class="photo-viewer" id="photo-viewer">
        <i class="ti ti-photo" style="font-size:36px; opacity:0.4" aria-hidden="true"></i>
      </div>
      <div class="detail-body" id="detail-body">
        <div class="detail-empty">
          旅行を選択すると、<br />ここに詳細が表示されます。
        </div>
      </div>
      <div class="detail-footer">
        <button class="btn-sm" id="edit-btn" type="button" disabled>
          <i class="ti ti-edit" style="font-size:11px" aria-hidden="true"></i> 編集
        </button>
        <button class="btn-sm" id="delete-btn" type="button" disabled>
          <i class="ti ti-trash" style="font-size:11px" aria-hidden="true"></i> 削除
        </button>
      </div>
    </aside>
  </div>

  <!-- 旅行登録モーダル -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">旅行を追加</span>
        <button class="icon-btn" id="modal-close-btn" type="button" aria-label="閉じる">
          <i class="ti ti-x" style="font-size:14px" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label class="modal-label" for="trip-name">旅行名 <span class="required">*</span></label>
          <input type="text" id="trip-name" placeholder="春の京都旅" maxlength="100" />
        </div>
        <div class="modal-field-row">
          <div class="modal-field">
            <label class="modal-label" for="trip-start">開始日 <span class="required">*</span></label>
            <input type="date" id="trip-start" />
          </div>
          <div class="modal-field">
            <label class="modal-label" for="trip-end">終了日 <span class="required">*</span></label>
            <input type="date" id="trip-end" />
          </div>
        </div>
        <div class="modal-field">
          <label class="modal-label">訪問場所</label>
          <div class="search-area">
            <input type="text" id="place-search" placeholder="住所・地名で検索（例: 清水寺）" autocomplete="off" />
            <div class="search-result-list" id="search-results" hidden></div>
          </div>
          <button class="btn-sm" id="map-pick-btn" type="button" style="margin-top:6px; align-self:flex-start;">
            <i class="ti ti-map-pin-plus" style="font-size:13px" aria-hidden="true"></i>
            地図から選ぶ
          </button>
          <div class="place-list" id="place-list"></div>
        </div>
        <div class="modal-field">
          <label class="modal-label">宿泊所</label>
          <div class="search-area">
            <input type="text" id="accommodation-search" placeholder="住所・地名で検索（例: 東横イン）" autocomplete="off" />
            <div class="search-result-list" id="accommodation-search-results" hidden></div>
          </div>
          <button class="btn-sm" id="accommodation-pick-btn" type="button" style="margin-top:6px; align-self:flex-start;">
            <i class="ti ti-map-pin-plus" style="font-size:13px" aria-hidden="true"></i>
            地図から選ぶ
          </button>
          <div class="place-list" id="accommodation-selected"></div>
        </div>
        <div class="modal-field">
          <label class="modal-label">移動手段</label>
          <div class="multiselect" data-category="transport"></div>
        </div>
        <div class="modal-field">
          <label class="modal-label">同行者</label>
          <div class="multiselect" data-category="companions"></div>
        </div>
        <div class="modal-field">
          <label class="modal-label">タグ</label>
          <div class="multiselect" data-category="tags"></div>
        </div>
        <div class="modal-field">
          <label class="modal-label" for="trip-memo">メモ</label>
          <textarea id="trip-memo" rows="3" placeholder="旅の自由メモ" maxlength="2000"></textarea>
        </div>
        <div class="modal-field">
          <label class="modal-label">写真</label>
          <div class="photo-upload">
            <div class="photo-upload-area" id="photo-upload-area">
              <i class="ti ti-photo-plus" style="font-size:18px" aria-hidden="true"></i>
              <div>クリックまたはドラッグ&amp;ドロップで写真を追加</div>
              <div style="font-size:11px;margin-top:4px;">最大 10 枚、長辺 1600px に自動リサイズされます</div>
            </div>
            <input type="file" id="photo-upload-input" class="photo-upload-input" accept="image/*" multiple />
            <div class="photo-upload-list" id="photo-upload-list"></div>
            <div class="photo-upload-progress" id="photo-upload-progress" hidden></div>
          </div>
        </div>
        <div class="form-error" id="form-error" hidden></div>
      </div>
      <div class="modal-footer">
        <button class="btn-sm" id="modal-cancel-btn" type="button">キャンセル</button>
        <button class="btn-primary" id="modal-save-btn" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <!-- Leaflet.heat プラグイン（Sprint 6 ヒートマップ用）。L.heatLayer を提供 -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'tabibako_trips';
      const MAP_DEFAULT_VIEW = { center: [36.5, 138.0], zoom: 5 };
      const NOMINATIM_BASE = 'https://nominatim.openstreetmap.org';
      const NOMINATIM_MIN_INTERVAL_MS = 1000; // 公式利用規約：1 req/sec
      const SEARCH_DEBOUNCE_MS = 500;
      // 47 都道府県（display_name に含まれているかの判定用）
      const PREFECTURES = [
        '北海道',
        '青森県', '岩手県', '宮城県', '秋田県', '山形県', '福島県',
        '茨城県', '栃木県', '群馬県', '埼玉県', '千葉県', '東京都', '神奈川県',
        '新潟県', '富山県', '石川県', '福井県', '山梨県', '長野県',
        '岐阜県', '静岡県', '愛知県', '三重県',
        '滋賀県', '京都府', '大阪府', '兵庫県', '奈良県', '和歌山県',
        '鳥取県', '島根県', '岡山県', '広島県', '山口県',
        '徳島県', '香川県', '愛媛県', '高知県',
        '福岡県', '佐賀県', '長崎県', '熊本県', '大分県', '宮崎県', '鹿児島県', '沖縄県',
      ];

      const App = {
        state: {
          trips: [],
          draft: null,                       // モーダルで編集中の旅行データ
          modalActive: false,                // モーダル open 中は true（ピン抑制フラグ）
          pickMode: false,                   // 地図クリックで場所追加モード
          pickTarget: 'place',               // 'place' | 'accommodation'
          selectedTripId: null,              // 左パネルで選択中の旅行 ID（null = 未選択）
          editingTripId: null,               // モーダルが編集モードのとき、対象 trip の ID
          editingOriginalPhotoIds: [],       // 編集前の写真 ID 一覧（削除判定に使用）
        },
        _preModalSelectedId: null,           // モーダル open 直前の selectedTripId を保持
        map: null,
        draftMarkers: [],
        draftAccommodationMarker: null,
        allTripMarkers: [],
        el: {},
        _lastApiRequestAt: 0,
        _throttleChain: Promise.resolve(),
        _searchRequestId: 0,
        _accommodationSearchRequestId: 0,

        async init() {
          this.cacheElements();
          this.storage.load();
          this.filter.load();
          this.heatmap.init();
          // パネル幅は mapInit より前に load + applyWidths（map が正しいサイズで初期化される）
          this.panelResize.load();
          this.panelResize.applyWidths();
          await this.photoDB.init();
          this.bindEvents();
          this.photoViewer.bindEvents();
          this.sort.bindEvents();
          this.filter.bindEvents();
          this.heatmap.bindEvents();
          this.panelResize.bindEvents();
          this.mapInit();
          // renderTripList の末尾で heatmap.render() が呼ばれるので、ここでの追加呼び出しは不要
          this.renderTripList();
          this.updateActionButtons();
        },

        cacheElements() {
          const ids = [
            'add-btn', 'trip-list', 'pin-count', 'pin-count-value', 'detail-body', 'photo-viewer',
            'edit-btn', 'delete-btn', 'heatmap-btn',
            'sort-btn', 'sort-dropdown', 'filter-section',
            'modal-backdrop', 'modal-close-btn', 'modal-cancel-btn', 'modal-save-btn',
            'modal-title',
            'trip-name', 'trip-start', 'trip-end',
            'trip-memo',
            'place-search', 'search-results', 'place-list', 'map-pick-btn',
            'accommodation-search', 'accommodation-search-results', 'accommodation-selected', 'accommodation-pick-btn',
            'form-error',
            'photo-upload-area', 'photo-upload-input', 'photo-upload-list', 'photo-upload-progress',
          ];
          ids.forEach(id => { this.el[id] = document.getElementById(id); });
        },

        bindEvents() {
          this.el['add-btn'].addEventListener('click', () => this.modalOpen());
          this.el['modal-close-btn'].addEventListener('click', () => this.modalClose());
          this.el['modal-cancel-btn'].addEventListener('click', () => this.modalClose());
          this.el['modal-save-btn'].addEventListener('click', () => this.modalSave());
          this.el['map-pick-btn'].addEventListener('click', () => this.setPickMode(true, 'place'));
          this.el['accommodation-pick-btn'].addEventListener('click', () => this.setPickMode(true, 'accommodation'));
          this.el['edit-btn'].addEventListener('click', () => {
            if (this.state.selectedTripId) this.modalOpen(this.state.selectedTripId);
          });
          this.el['delete-btn'].addEventListener('click', () => {
            if (this.state.selectedTripId) this.deleteSelectedTrip();
          });

          // 旅行カードのクリック（event delegation: 動的に追加されるカードに自動対応）
          this.el['trip-list'].addEventListener('click', (e) => {
            const card = e.target.closest('.trip-card');
            if (!card) return;
            this.selectTrip(card.dataset.tripId);
          });

          // 旅行カードのキーボード操作（Enter / Space で選択 toggle）
          this.el['trip-list'].addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const card = e.target.closest('.trip-card');
            if (!card) return;
            e.preventDefault();
            this.selectTrip(card.dataset.tripId);
          });

          // 住所検索（debounce + IME 対応）。IME 変換中は再描画しない、
          // 確定後に再描画されるとデバウンス起点が増えるので compositionend からも再評価
          let placeSearchComposing = false;
          this.el['place-search'].addEventListener('compositionstart', () => { placeSearchComposing = true; });
          this.el['place-search'].addEventListener('compositionend', () => {
            placeSearchComposing = false;
            // 確定値で改めて debounce タイマーを開始
            debouncedSearch();
          });
          const debouncedSearch = this.debounce(() => {
            if (placeSearchComposing) return;
            const q = this.el['place-search'].value.trim();
            if (q) {
              this.searchAddress(q);
            } else {
              this._searchRequestId++;
              this.renderSearchResults(null);
            }
          }, SEARCH_DEBOUNCE_MS);
          this.el['place-search'].addEventListener('input', debouncedSearch);

          // 宿泊所検索（debounce + IME 対応）
          let accommodationSearchComposing = false;
          this.el['accommodation-search'].addEventListener('compositionstart', () => { accommodationSearchComposing = true; });
          this.el['accommodation-search'].addEventListener('compositionend', () => {
            accommodationSearchComposing = false;
            debouncedAccommodationSearch();
          });
          const debouncedAccommodationSearch = this.debounce(() => {
            if (accommodationSearchComposing) return;
            const q = this.el['accommodation-search'].value.trim();
            if (q) {
              this.searchAccommodation(q);
            } else {
              this._accommodationSearchRequestId++;
              this.renderAccommodationSearchResults(null);
            }
          }, SEARCH_DEBOUNCE_MS);
          this.el['accommodation-search'].addEventListener('input', debouncedAccommodationSearch);

          // Document レベルのキーボードハンドラ集約
          document.addEventListener('keydown', (e) => {
            // Esc：ピックモード解除 or モーダル閉じる
            if (e.key === 'Escape') {
              if (this.state.pickMode) { this.setPickMode(false); return; }
              if (!this.el['modal-backdrop'].hidden) { this.modalClose(); return; }
            }
            // 写真ビューア：矢印キーで前後切替（モーダル非表示時のみ・input/textarea フォーカス時は無視）
            this.photoViewer.handleArrowKey(e);
          });

          // Document レベルのマウスダウン集約：multiselect / ソートドロップダウンを外クリックで閉じる。
          // mousedown を使うのは、click 時点では DOM が render() で差し替わって
          // e.target が detached になり closest() が機能しなくなるため
          document.addEventListener('mousedown', (e) => {
            if (!e.target.closest('.multiselect')) {
              this.multiSelect.closeAll();
            }
            if (!e.target.closest('#sort-dropdown') && !e.target.closest('#sort-btn')) {
              this.sort.close();
            }
          });

          // 背景クリックで閉じる（ピックモード中は無効）
          this.el['modal-backdrop'].addEventListener('click', (e) => {
            if (e.target === this.el['modal-backdrop'] && !this.state.pickMode) {
              this.modalClose();
            }
          });
        },

        // ===== Map =====
        mapInit() {
          this.map = L.map('map', {
            center: MAP_DEFAULT_VIEW.center,
            zoom: MAP_DEFAULT_VIEW.zoom,
            zoomControl: false,
            worldCopyJump: true,
          });
          L.control.zoom({ position: 'bottomright' }).addTo(this.map);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          }).addTo(this.map);
          this.map.on('click', (e) => this.onMapClick(e));
        },

        async onMapClick(e) {
          if (!this.state.pickMode) return;
          const { lat, lng } = e.latlng;
          const target = this.state.pickTarget;
          this.setPickMode(false);

          let name = '';
          try {
            name = await this.reverseGeocode(lat, lng);
          } catch (err) {
            console.warn('逆引きに失敗しました', err);
          }
          const placeObj = {
            name: name || `(${lat.toFixed(4)}, ${lng.toFixed(4)})`,
            lat,
            lng,
          };
          if (target === 'accommodation') {
            this.setDraftAccommodation(placeObj);
          } else {
            this.addPlaceToDraft(placeObj);
          }
        },

        renderDraftPins() {
          this.draftMarkers.forEach(m => this.map.removeLayer(m));
          this.draftMarkers = [];
          const places = this.state.draft?.places || [];
          places.forEach(p => {
            const marker = L.marker([p.lat, p.lng], { icon: this.createPinIcon() })
              .bindPopup(this.escape(p.name))
              .addTo(this.map);
            this.draftMarkers.push(marker);
          });

          if (this.draftAccommodationMarker) {
            this.map.removeLayer(this.draftAccommodationMarker);
            this.draftAccommodationMarker = null;
          }
          const acc = this.state.draft?.accommodation;
          if (acc && acc.lat != null && acc.lng != null) {
            this.draftAccommodationMarker = L.marker([acc.lat, acc.lng], { icon: this.createAccommodationPinIcon() })
              .bindPopup(this.escape(acc.name))
              .addTo(this.map);
          }

          this.renderPinCount();
        },

        // フィルター済み全旅行のピンを地図に表示（Issue #5 の方針）。
        // - 未選択時：全件を default 青で表示
        // - 選択時：選択旅行を selected オレンジ、他旅行を dim グレー青で表示
        // - ヒートマップ ON 時：俯瞰モード優先で全ピン非表示
        // - モーダル open 中（modalActive=true）：draft ピンに集中するため全ピン非表示
        renderAllTripPins() {
          this.allTripMarkers.forEach(m => this.map.removeLayer(m));
          this.allTripMarkers = [];

          if (this.state.modalActive || this.heatmap.isEnabled()) {
            this.renderPinCount();
            return;
          }

          const trips = this.filter.apply(this.state.trips);
          const selectedId = this.state.selectedTripId;

          trips.forEach(trip => {
            let variant;
            if (selectedId === null) variant = 'default';
            else if (trip.id === selectedId) variant = 'selected';
            else variant = 'dim';

            (trip.places || []).forEach(p => {
              const tripName = trip.name || '名称未設定';
              const placeName = p.name || '名称なし';
              const popupContent = `${this.escape(tripName)}：${this.escape(placeName)}`;
              const marker = L.marker([p.lat, p.lng], { icon: this.createPinIcon(variant) })
                .bindPopup(popupContent)
                .addTo(this.map);
              this.allTripMarkers.push(marker);
            });

            if (trip.id === selectedId) {
              const acc = trip.accommodation;
              if (acc && acc.lat != null && acc.lng != null) {
                const marker = L.marker([acc.lat, acc.lng], { icon: this.createAccommodationPinIcon() })
                  .bindPopup(`宿泊所：${this.escape(acc.name)}`)
                  .addTo(this.map);
                this.allTripMarkers.push(marker);
              }
            }
          });

          this.renderPinCount();
        },

        // 地図に表示されているピン数を反映。draft + draft 宿泊所 + 全旅行表示の合算。
        // ヒートマップ ON 時はピン非表示のため pin-count バッジ自体を隠す
        renderPinCount() {
          const pinCountEl = this.el['pin-count'];
          if (this.heatmap.isEnabled()) {
            pinCountEl.hidden = true;
            return;
          }
          pinCountEl.hidden = false;
          const accCount = this.draftAccommodationMarker ? 1 : 0;
          this.el['pin-count-value'].textContent =
            this.draftMarkers.length + accCount + this.allTripMarkers.length;
        },

        // Tabler Icon ベースのカスタムピン。標準マーカー画像の CDN/CORS 問題を回避し
        // プロジェクトのアイコンシステムとも統一する
        // variant: 'default' | 'dim' | 'selected'
        createPinIcon(variant = 'default') {
          return L.divIcon({
            className: `tabibako-pin tabibako-pin-${variant}`,
            html: '<i class="ti ti-map-pin-filled" aria-hidden="true"></i>',
            iconSize: [32, 32],
            iconAnchor: [16, 30],
            popupAnchor: [0, -28],
          });
        },

        createAccommodationPinIcon() {
          return L.divIcon({
            className: 'tabibako-pin tabibako-pin-accommodation',
            html: '<i class="ti ti-bed" aria-hidden="true"></i>',
            iconSize: [32, 32],
            iconAnchor: [16, 30],
            popupAnchor: [0, -28],
          });
        },

        // ===== Nominatim API =====
        // 並行呼び出しを Promise チェーンで直列化し、確実に 1 req/sec を守る。
        // 直前リンクの拒否は無視（throttle 自体は失敗しない設計）
        async _throttle() {
          const next = this._throttleChain.then(async () => {
            const wait = Math.max(0, NOMINATIM_MIN_INTERVAL_MS - (Date.now() - this._lastApiRequestAt));
            if (wait > 0) await new Promise(r => setTimeout(r, wait));
            this._lastApiRequestAt = Date.now();
          });
          this._throttleChain = next.catch(() => {});
          return next;
        },

        // request ID で「最新の検索だけを反映」する。debounce + throttle の合間に
        // 入力が変化した場合、古いレスポンスを無視する
        async searchAddress(query) {
          const myRequestId = ++this._searchRequestId;
          this.renderSearchResults('loading');
          await this._throttle();
          if (myRequestId !== this._searchRequestId) return;
          try {
            const url = `${NOMINATIM_BASE}/search?q=${encodeURIComponent(query)}&format=json&accept-language=ja&limit=5`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (myRequestId !== this._searchRequestId) return;
            this.renderSearchResults(data);
          } catch (err) {
            if (myRequestId !== this._searchRequestId) return;
            console.error('住所検索に失敗しました', err);
            this.renderSearchResults([]);
          }
        },

        async reverseGeocode(lat, lng) {
          await this._throttle();
          const url = `${NOMINATIM_BASE}/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          return data.display_name || '';
        },

        // ===== Modal =====
        // tripId が null なら新規追加、文字列なら該当 trip の編集
        async modalOpen(tripId = null) {
          const editing = tripId != null;
          const existing = editing ? this.state.trips.find(t => t.id === tripId) : null;
          if (editing && !existing) {
            console.error('編集対象の旅行が見つかりません:', tripId);
            return;
          }

          // モーダル open 前の selectedTripId を保持（modalClose で復元）
          this._preModalSelectedId = this.state.selectedTripId;

          // draft / editing state を先にセット。
          // modalActive=true により renderAllTripPins が全ピン表示を抑制する（draft pins だけが地図に出る）
          this.state.modalActive = true;
          this.state.draft = editing
            ? JSON.parse(JSON.stringify(existing))
            : this.createBlankTrip();
          this.state.editingTripId = editing ? tripId : null;
          this.state.editingOriginalPhotoIds = editing ? (existing.photos || []).map(p => p.id) : [];

          // 編集モード：右パネルと写真ビューアは編集中なのでクリア
          if (editing) {
            this.state.selectedTripId = null;
            this.renderTripDetail();
            this.photoViewer.clear();
          }

          // フォームフィールドにデータを反映
          const draft = this.state.draft;
          this.el['trip-name'].value = draft.name || '';
          this.el['trip-start'].value = draft.startDate || '';
          this.el['trip-end'].value = draft.endDate || '';
          this.el['trip-memo'].value = draft.memo || '';
          this.el['place-search'].value = '';
          this.el['accommodation-search'].value = '';
          this.renderAccommodationSearchResults(null);
          this.renderAccommodationSelected();
          this.el['form-error'].hidden = true;
          this.el['modal-title'].textContent = editing ? '旅行を編集' : '旅行を追加';

          // UI 再描画。renderTripList 内で renderAllTripPins が呼ばれるが
          // state.modalActive=true のため全ピン表示は抑制される
          this.renderTripList();
          this.renderSearchResults(null);
          this.renderPlaceList();
          this.renderDraftPins();
          this.multiSelect.resetAndRenderAll();

          // 写真エリアは先に空状態でレンダリング → モーダル表示 → 写真は非同期ロード。
          // 写真ロードを待つと編集モーダル表示までに遅延が出るため
          this.photoUpload.resetAndRender();
          this.photoUpload.bindEvents();

          this.el['modal-backdrop'].hidden = false;
          this.el['trip-name'].focus();

          // 既存写真は表示後にバックグラウンドでロード
          if (editing && existing.photos && existing.photos.length > 0) {
            await this.photoUpload.loadFromTrip(existing.photos);
          }
        },

        modalClose() {
          this.setPickMode(false);
          this.el['modal-backdrop'].hidden = true;
          this.state.modalActive = false;
          this.state.draft = null;
          this.state.editingTripId = null;
          this.state.editingOriginalPhotoIds = [];
          this.renderDraftPins();
          this.photoUpload.resetAndRender(); // pending を解放

          // モーダル open 前の選択を復元（trip が削除済みなら復元しない）
          const restoreId = this._preModalSelectedId;
          this._preModalSelectedId = null;
          if (restoreId && this.state.trips.some(t => t.id === restoreId)) {
            this.state.selectedTripId = restoreId;
            this.renderTripDetail();
            this.photoViewer.load(this.getSelectedTrip());
          } else {
            // 削除済みの場合はクリア
            this.state.selectedTripId = null;
            this.renderTripDetail();
            this.photoViewer.clear();
          }
          // 全ピン表示を復元（modalActive=false）。selectedTripId 復元の有無に関わらず必要
          this.renderTripList();
          this.updateActionButtons();
        },

        async modalSave() {
          const draft = this.state.draft;
          if (!draft) return;
          draft.name = this.el['trip-name'].value.trim();
          draft.startDate = this.el['trip-start'].value;
          draft.endDate = this.el['trip-end'].value;
          draft.memo = this.el['trip-memo'].value.trim();
          // transport / companions / tags は multiSelect が draft.* に直接書き込み済み

          const error = this.validateDraft(draft);
          if (error) {
            this.el['form-error'].textContent = error;
            this.el['form-error'].hidden = false;
            return;
          }

          // 保存中は二重クリック防止のため save ボタンを無効化。
          // 写真コミット失敗時は trip 自体も保存しない（中途半端な状態を防ぐ）
          this.el['modal-save-btn'].disabled = true;
          try {
            draft.photos = await this.photoUpload.commitToDraft();

            let oldPhotoIdsToDelete = [];
            if (this.state.editingTripId) {
              // 編集モード: 既存 trip を置換、削除対象写真は localStorage 保存後に IDB から消す
              const newPhotoIds = new Set(draft.photos.map(p => p.id));
              oldPhotoIdsToDelete = this.state.editingOriginalPhotoIds.filter(id => !newPhotoIds.has(id));
              const idx = this.state.trips.findIndex(t => t.id === this.state.editingTripId);
              if (idx >= 0) this.state.trips[idx] = draft;
            } else {
              this.state.trips.push(draft);
            }

            // 先に localStorage に保存（失敗時は throw → catch で UI 通知）
            this.storage.save();

            // localStorage 保存成功後に IDB から旧写真削除（失敗してもログのみ）
            for (const id of oldPhotoIdsToDelete) {
              try { await this.photoDB.delete(id); }
              catch (err) { console.warn('古い写真の削除に失敗:', id, err); }
            }

            // renderTripList は modalClose 末尾で呼ばれるので個別呼び出し不要
            this.modalClose();
          } catch (err) {
            console.error('保存に失敗:', err);
            this.el['form-error'].textContent = err.message || '保存中にエラーが発生しました';
            this.el['form-error'].hidden = false;
          } finally {
            this.el['modal-save-btn'].disabled = false;
          }
        },

        validateDraft(draft) {
          if (!draft.name) return '旅行名を入力してください';
          if (!draft.startDate) return '開始日を入力してください';
          if (!draft.endDate) return '終了日を入力してください';
          if (draft.startDate > draft.endDate) return '終了日は開始日以降にしてください';
          // 訪問場所は任意（仕様書では必須だが、Sprint 4 で UX 柔軟性のため任意化）
          return null;
        },

        createBlankTrip() {
          return {
            id: crypto.randomUUID(),
            name: '',
            startDate: '',
            endDate: '',
            places: [],
            regions: [],       // Sprint 5 で自動判定（国内=都道府県・海外=国名）
            accommodation: { name: '', lat: null, lng: null }, // Issue #7 で地図選択対応
            transport: [],     // Sprint 4
            companions: [],    // Sprint 4
            tags: [],          // Sprint 4
            memo: '',          // Sprint 4
            photos: [],        // Sprint 4
          };
        },

        // ===== Trip Selection =====
        // 同じ ID をもう一度クリックで解除（toggle）
        selectTrip(tripId) {
          this.state.selectedTripId = (this.state.selectedTripId === tripId) ? null : tripId;
          // renderTripList が内部で renderAllTripPins を呼ぶので個別呼び出し不要
          this.renderTripList();
          this.renderTripDetail();
          this.photoViewer.load(this.getSelectedTrip());
          this.updateActionButtons();
          this.fitMapToSelectedTrip();
        },

        // 選択中の旅行の全 places が画面内に収まるよう地図ビューを調整。
        // 選択解除（selectedTripId が null）になったときは何もしない（現在のビューを保持）。
        // ヒートマップ ON 時は俯瞰モード優先で何もしない
        fitMapToSelectedTrip() {
          if (this.heatmap.isEnabled()) return;
          const trip = this.getSelectedTrip();
          if (!trip) return;
          // 不正座標（NaN・範囲外）を除外してから判定
          const valid = (trip.places || []).filter(p =>
            Number.isFinite(p.lat) && Number.isFinite(p.lng) &&
            Math.abs(p.lat) <= 90 && Math.abs(p.lng) <= 180
          );
          // 宿泊所の座標も bounds に含める
          const acc = trip.accommodation;
          if (acc && Number.isFinite(acc.lat) && Number.isFinite(acc.lng) &&
              Math.abs(acc.lat) <= 90 && Math.abs(acc.lng) <= 180) {
            valid.push(acc);
          }
          if (valid.length === 0) return;
          if (valid.length === 1) {
            this.map.setView([valid[0].lat, valid[0].lng], 12);
            return;
          }
          const bounds = L.latLngBounds(valid.map(p => [p.lat, p.lng]));
          if (!bounds.isValid()) return;
          this.map.fitBounds(bounds, { padding: [40, 40] });
        },

        // 右パネル下部の編集・削除ボタンの活性状態を選択状況に同期
        updateActionButtons() {
          const hasSelection = !!this.state.selectedTripId;
          if (this.el['edit-btn']) this.el['edit-btn'].disabled = !hasSelection;
          if (this.el['delete-btn']) this.el['delete-btn'].disabled = !hasSelection;
        },

        // ヒートマップボタンの active 表示を状態に同期
        updateHeatmapButton() {
          const btn = this.el['heatmap-btn'];
          if (!btn) return;
          const on = this.heatmap.isEnabled();
          btn.classList.toggle('active', on);
          btn.setAttribute('aria-pressed', String(on));
        },

        // 選択中の旅行を削除（確認ダイアログ → localStorage 保存 → IDB 写真クリーンアップ）
        // localStorage 保存が先：失敗時に rollback できるよう IDB 削除は保存成功後に
        async deleteSelectedTrip() {
          const trip = this.getSelectedTrip();
          if (!trip) return;
          const message = `「${trip.name}」を削除しますか？\n（取り消しできません。関連する写真もすべて削除されます）`;
          if (!confirm(message)) return;

          const tripBackup = trip;
          this.state.trips = this.state.trips.filter(t => t.id !== trip.id);
          this.state.selectedTripId = null;

          try {
            this.storage.save();
          } catch (err) {
            console.error('削除の保存に失敗:', err);
            alert(err.message || '削除に失敗しました');
            // Rollback in-memory state
            this.state.trips.push(tripBackup);
            this.state.selectedTripId = tripBackup.id;
            this.renderTripList();
            this.updateActionButtons();
            return;
          }

          // 保存成功後に IDB から写真削除（失敗してもログのみ）
          for (const photo of (trip.photos || [])) {
            try { await this.photoDB.delete(photo.id); }
            catch (err) { console.warn('写真の削除に失敗:', photo.id, err); }
          }

          // renderTripList が renderAllTripPins を含むので個別呼び出し不要
          this.renderTripList();
          this.renderTripDetail();
          this.photoViewer.clear();
          this.updateActionButtons();
        },

        getSelectedTrip() {
          if (!this.state.selectedTripId) return null;
          return this.state.trips.find(t => t.id === this.state.selectedTripId) || null;
        },

        // ===== Pick Mode =====
        setPickMode(on, target = 'place') {
          this.state.pickMode = on;
          this.state.pickTarget = on ? target : 'place';
          document.body.classList.toggle('pick-mode', on);
          this.el['modal-backdrop'].classList.toggle('pick-mode', on);
        },

        // ===== Draft places =====
        addPlaceToDraft(place) {
          if (!this.state.draft) return;
          place.region = this.extractRegion(place.name);
          this.state.draft.places.push(place);
          this.recomputeRegions(this.state.draft);
          this.el['place-search'].value = '';
          this.renderSearchResults(null);
          this.renderPlaceList();
          this.renderDraftPins();
        },

        removePlaceFromDraft(index) {
          if (!this.state.draft) return;
          this.state.draft.places.splice(index, 1);
          this.recomputeRegions(this.state.draft);
          this.renderPlaceList();
          this.renderDraftPins();
        },

        // ===== Draft accommodation =====
        setDraftAccommodation(place) {
          if (!this.state.draft) return;
          this.state.draft.accommodation = place;
          this.el['accommodation-search'].value = '';
          this.renderAccommodationSearchResults(null);
          this.renderAccommodationSelected();
          this.renderDraftPins();
        },

        clearDraftAccommodation() {
          if (!this.state.draft) return;
          this.state.draft.accommodation = { name: '', lat: null, lng: null };
          this.renderAccommodationSelected();
          this.renderDraftPins();
        },

        renderAccommodationSelected() {
          const container = this.el['accommodation-selected'];
          const acc = this.state.draft?.accommodation;
          if (!acc || !acc.name) {
            container.innerHTML = '';
            return;
          }
          container.innerHTML = `
            <div class="place-item">
              <span class="place-item-name">${this.escape(acc.name)}</span>
              <button class="place-item-remove" type="button" aria-label="削除">
                <i class="ti ti-x" style="font-size:11px" aria-hidden="true"></i>
              </button>
            </div>
          `;
          container.querySelector('.place-item-remove').addEventListener('click', () => {
            this.clearDraftAccommodation();
          });
        },

        renderAccommodationSearchResults(items) {
          const container = this.el['accommodation-search-results'];
          if (items === null) {
            container.hidden = true;
            container.innerHTML = '';
            return;
          }
          if (items === 'loading') {
            container.hidden = false;
            container.innerHTML = '<div class="search-result-loading">検索中…</div>';
            return;
          }
          if (items.length === 0) {
            container.hidden = false;
            container.innerHTML = '<div class="search-result-empty">該当する場所が見つかりませんでした</div>';
            return;
          }
          container.hidden = false;
          container.innerHTML = items.map((item, i) => `
            <div class="search-result-item" data-index="${i}">${this.escape(item.display_name)}</div>
          `).join('');
          container.querySelectorAll('.search-result-item').forEach((el, i) => {
            el.addEventListener('click', () => {
              const item = items[i];
              this.setDraftAccommodation({
                name: item.display_name,
                lat: parseFloat(item.lat),
                lng: parseFloat(item.lon),
              });
            });
          });
        },

        async searchAccommodation(query) {
          const myRequestId = ++this._accommodationSearchRequestId;
          this.renderAccommodationSearchResults('loading');
          await this._throttle();
          if (myRequestId !== this._accommodationSearchRequestId) return;
          try {
            const url = `${NOMINATIM_BASE}/search?q=${encodeURIComponent(query)}&format=json&accept-language=ja&limit=5`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (myRequestId !== this._accommodationSearchRequestId) return;
            this.renderAccommodationSearchResults(data);
          } catch (err) {
            if (myRequestId !== this._accommodationSearchRequestId) return;
            console.warn('宿泊所検索に失敗しました', err);
            this.renderAccommodationSearchResults([]);
          }
        },

        // ===== Storage =====
        storage: {
          load() {
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              App.state.trips = raw ? JSON.parse(raw) : [];
              // マイグレーション：旧 prefecture/prefectures → 新 region/regions。
              // 既存データの region を display_name から再抽出（国内=都道府県・海外=国名）
              for (const trip of App.state.trips) {
                if (!Array.isArray(trip.places)) trip.places = [];
                for (const p of trip.places) {
                  if (!p.region && p.prefecture) p.region = p.prefecture;
                  if (!p.region) p.region = App.extractRegion(p.name);
                  delete p.prefecture;
                }
                App.recomputeRegions(trip);
                delete trip.prefectures;
                // マイグレーション：旧 string accommodation → 新 { name, lat, lng } オブジェクト
                if (typeof trip.accommodation === 'string') {
                  trip.accommodation = { name: trip.accommodation, lat: null, lng: null };
                } else if (!trip.accommodation || typeof trip.accommodation !== 'object') {
                  trip.accommodation = { name: '', lat: null, lng: null };
                }
              }
            } catch (err) {
              console.error('localStorage の読み込みに失敗', err);
              App.state.trips = [];
            }
          },
          save() {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(App.state.trips));
            } catch (err) {
              console.error('localStorage の書き込みに失敗', err);
              // 呼び出し側で catch して整合性復旧できるよう throw
              throw new Error('localStorage の容量制限に達したため保存できませんでした');
            }
          },
        },

        // ===== Photo Storage (IndexedDB) =====
        // 写真本体は localStorage の容量上限 (~5MB) では足りないため IDB に分離。
        // 旅行データの photos は { id } の参照のみで、本体は photos ストアに格納
        photoDB: {
          DB_NAME: 'tabibako',
          DB_VERSION: 1,
          STORE: 'photos',
          _db: null,

          init() {
            return new Promise((resolve, reject) => {
              const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);
              request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(this.STORE)) {
                  db.createObjectStore(this.STORE, { keyPath: 'id' });
                }
              };
              request.onsuccess = (e) => {
                this._db = e.target.result;
                resolve();
              };
              request.onerror = (e) => {
                console.error('IndexedDB の初期化に失敗', e.target.error);
                reject(e.target.error);
              };
            });
          },

          // photo: { id, dataURL, createdAt }
          put(photo) {
            return new Promise((resolve, reject) => {
              const tx = this._db.transaction(this.STORE, 'readwrite');
              const req = tx.objectStore(this.STORE).put(photo);
              req.onsuccess = () => resolve(photo.id);
              req.onerror = (e) => reject(e.target.error);
            });
          },

          get(id) {
            return new Promise((resolve, reject) => {
              const tx = this._db.transaction(this.STORE, 'readonly');
              const req = tx.objectStore(this.STORE).get(id);
              req.onsuccess = () => resolve(req.result || null);
              req.onerror = (e) => reject(e.target.error);
            });
          },

          getMany(ids) {
            return Promise.all(ids.map(id => this.get(id)));
          },

          delete(id) {
            return new Promise((resolve, reject) => {
              const tx = this._db.transaction(this.STORE, 'readwrite');
              const req = tx.objectStore(this.STORE).delete(id);
              req.onsuccess = () => resolve();
              req.onerror = (e) => reject(e.target.error);
            });
          },
        },

        // ===== マルチセレクト UI（Notion 型ドロップダウン）=====
        // 3 プロパティ（transport / companions / tags）で UI を共有、値プールは独立
        multiSelect: {
          POOL_KEYS: {
            transport: 'tabibako_transport_pool',
            companions: 'tabibako_companions_pool',
            tags: 'tabibako_tags_pool',
          },
          POOL_DEFAULTS: {
            transport: ['徒歩', '自転車', '車', '電車', 'バス', '飛行機', '船'],
            companions: [],
            tags: [],
          },
          CATEGORIES: ['transport', 'companions', 'tags'],
          PLACEHOLDERS: {
            transport: '移動手段を追加',
            companions: '同行者を追加',
            tags: 'タグを追加',
          },

          // category → { open, query, activeIndex }
          _ui: {},
          _eventsBound: false,

          getPool(category) {
            try {
              const raw = localStorage.getItem(this.POOL_KEYS[category]);
              if (raw) return JSON.parse(raw);
            } catch (err) {
              console.error('値プール読み込み失敗', err);
            }
            return [...this.POOL_DEFAULTS[category]];
          },

          savePool(category, pool) {
            try {
              localStorage.setItem(this.POOL_KEYS[category], JSON.stringify(pool));
            } catch (err) {
              console.error('値プール保存失敗', err);
            }
          },

          // draft 上の選択中の値
          getSelected(category) {
            return App.state.draft?.[category] || [];
          },

          setSelected(category, values) {
            if (App.state.draft) App.state.draft[category] = values;
          },

          // 全カテゴリの UI 状態リセットと再描画。モーダル開閉時に呼ぶ
          resetAndRenderAll() {
            this.CATEGORIES.forEach(cat => {
              this._ui[cat] = { open: false, query: '', activeIndex: -1 };
              this.render(cat);
            });
            if (!this._eventsBound) {
              this.bindEvents();
              this._eventsBound = true;
            }
          },

          // 候補リスト（プール - 選択済み）を query でフィルター
          filteredOptions(category) {
            const pool = this.getPool(category);
            const selected = this.getSelected(category);
            const q = (this._ui[category]?.query || '').trim().toLowerCase();
            const remaining = pool.filter(v => !selected.includes(v));
            if (!q) return remaining;
            return remaining.filter(v => v.toLowerCase().includes(q));
          },

          // 「+ "xxx" を新規追加」が表示されるかの判定
          canAddNew(category) {
            const q = (this._ui[category]?.query || '').trim();
            if (!q) return false;
            const pool = this.getPool(category);
            const selected = this.getSelected(category);
            // プールにも選択済みにも一致しないときのみ
            return !pool.includes(q) && !selected.includes(q);
          },

          render(category) {
            const root = document.querySelector(`.multiselect[data-category="${category}"]`);
            if (!root) return;
            const ui = this._ui[category] || { open: false, query: '', activeIndex: -1 };
            const selected = this.getSelected(category);

            const chips = selected.map(v => `
              <span class="multiselect-chip">${App.escape(v)}<button class="multiselect-chip-remove" type="button" data-value="${App.escape(v)}" aria-label="削除">×</button></span>
            `).join('');

            const inputHtml = `
              <input class="multiselect-input" type="text" autocomplete="off"
                     placeholder="${App.escape(this.PLACEHOLDERS[category])}" value="${App.escape(ui.query)}" />
            `;

            let dropdownHtml = '';
            if (ui.open) {
              const options = this.filteredOptions(category);
              const optionsHtml = options.map((v, i) => `
                <div class="multiselect-option${i === ui.activeIndex ? ' active' : ''}" data-value="${App.escape(v)}" data-index="${i}">
                  <span class="multiselect-option-label">${App.escape(v)}</span>
                  <button class="multiselect-option-delete" type="button" data-pool-value="${App.escape(v)}" aria-label="候補から削除" title="候補から削除">×</button>
                </div>
              `).join('');
              const addNewIndex = options.length;
              const addNewHtml = this.canAddNew(category) ? `
                <div class="multiselect-add${addNewIndex === ui.activeIndex ? ' active' : ''}" data-index="${addNewIndex}">+ "${App.escape(ui.query.trim())}" を新規追加</div>
              ` : '';
              const emptyHtml = (options.length === 0 && !this.canAddNew(category)) ? `
                <div class="multiselect-option" style="cursor:default;color:var(--color-text-secondary)">候補がありません</div>
              ` : '';
              dropdownHtml = `<div class="multiselect-dropdown">${optionsHtml}${addNewHtml || emptyHtml}</div>`;
            } else {
              dropdownHtml = `<div class="multiselect-dropdown" hidden></div>`;
            }

            root.innerHTML = `
              <div class="multiselect-field">${chips}${inputHtml}</div>
              ${dropdownHtml}
            `;

            // 描画後にフォーカス復元（dropdown を開いた直後など）
            if (ui.open) {
              const input = root.querySelector('.multiselect-input');
              if (input && document.activeElement !== input) {
                input.focus();
                // カーソルを末尾に
                const len = input.value.length;
                input.setSelectionRange(len, len);
              }
            }
          },

          open(category) {
            const ui = this._ui[category] || {};
            ui.open = true;
            ui.activeIndex = -1;
            this._ui[category] = ui;
            this.render(category);
          },

          close(category) {
            if (this._ui[category]) {
              this._ui[category].open = false;
              this._ui[category].query = '';
              this._ui[category].activeIndex = -1;
            }
            this.render(category);
          },

          // 値の選択/解除トグル
          toggleValue(category, value) {
            const selected = this.getSelected(category);
            const idx = selected.indexOf(value);
            if (idx >= 0) selected.splice(idx, 1);
            else selected.push(value);
            this.setSelected(category, [...selected]);
            // 選択後も dropdown は開いたまま、検索クエリはリセット
            if (this._ui[category]) this._ui[category].query = '';
            this.render(category);
          },

          addNewAndSelect(category, value) {
            const trimmed = value.trim();
            if (!trimmed) return;
            const pool = this.getPool(category);
            if (!pool.includes(trimmed)) {
              pool.push(trimmed);
              this.savePool(category, pool);
            }
            const selected = this.getSelected(category);
            if (!selected.includes(trimmed)) {
              selected.push(trimmed);
              this.setSelected(category, [...selected]);
            }
            if (this._ui[category]) {
              this._ui[category].query = '';
              this._ui[category].activeIndex = -1;
            }
            this.render(category);
          },

          // チップ × での削除（選択中の draft から外す）
          removeValue(category, value) {
            const selected = this.getSelected(category).filter(v => v !== value);
            this.setSelected(category, selected);
            this.render(category);
          },

          // 候補ホバー時の × で「値プール」から完全削除（過去の選択値を整理）
          // 保存済みの旅行データには影響しない（仕様書「将来対応」の前倒し実装）
          deleteFromPool(category, value) {
            const pool = this.getPool(category).filter(v => v !== value);
            this.savePool(category, pool);
            // 現在 draft で選択中なら外す
            const selected = this.getSelected(category).filter(v => v !== value);
            this.setSelected(category, selected);
            this.render(category);
            // プールが変わったので絞り込み UI と trip-list も再描画（filter._syncWithPool が走る）
            App.renderTripList();
          },

          // ↑↓ で activeIndex 移動
          moveActive(category, delta) {
            const ui = this._ui[category];
            if (!ui || !ui.open) return;
            const optionsCount = this.filteredOptions(category).length;
            const total = optionsCount + (this.canAddNew(category) ? 1 : 0);
            if (total === 0) return;
            let next = ui.activeIndex + delta;
            if (next < 0) next = total - 1;
            if (next >= total) next = 0;
            ui.activeIndex = next;
            this.render(category);
          },

          // Enter で active な候補を選択（または add）
          confirmActive(category) {
            const ui = this._ui[category];
            if (!ui || !ui.open) return;
            const options = this.filteredOptions(category);
            const optionsCount = options.length;
            const addAvailable = this.canAddNew(category);

            if (ui.activeIndex < 0) {
              // active 候補なし。query が新規値として追加可能ならそれを採用
              if (addAvailable) {
                this.addNewAndSelect(category, ui.query.trim());
              }
              return;
            }
            if (ui.activeIndex < optionsCount) {
              this.toggleValue(category, options[ui.activeIndex]);
              return;
            }
            if (ui.activeIndex === optionsCount && addAvailable) {
              this.addNewAndSelect(category, ui.query.trim());
            }
          },

          // 共通イベントバインド（初回のみ）
          bindEvents() {
            this.CATEGORIES.forEach(cat => {
              const root = document.querySelector(`.multiselect[data-category="${cat}"]`);
              if (!root) return;

              // クリック処理を 1 ハンドラに統合。外クリック検出は App.bindEvents 側で
              // mousedown ベースに変更したため stopPropagation は不要
              root.addEventListener('click', (e) => {
