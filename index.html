                const removeBtn = e.target.closest('.multiselect-chip-remove');
                if (removeBtn) {
                  this.removeValue(cat, removeBtn.dataset.value);
                  return;
                }
                // 候補の × は「値プールから削除」（option click より先に判定）
                const poolDeleteBtn = e.target.closest('.multiselect-option-delete');
                if (poolDeleteBtn) {
                  const value = poolDeleteBtn.dataset.poolValue;
                  if (confirm(`候補から「${value}」を削除しますか？\n（保存済みの旅行データはそのまま残ります）`)) {
                    this.deleteFromPool(cat, value);
                  }
                  return;
                }
                const opt = e.target.closest('.multiselect-option');
                if (opt && opt.dataset.value) {
                  this.toggleValue(cat, opt.dataset.value);
                  return;
                }
                const add = e.target.closest('.multiselect-add');
                if (add) {
                  const q = (this._ui[cat]?.query || '').trim();
                  if (q) this.addNewAndSelect(cat, q);
                  return;
                }
                if (e.target.closest('.multiselect-field')) {
                  this.open(cat);
                }
              });

              // 入力イベント。IME 確定前（e.isComposing）は再描画しない。
              // 再描画すると input 要素ごと差し替わって IME の composition 状態が失われ、
              // 「sa」と打って「さ」に変換されるはずが「sあ」のような壊れた表示になる
              root.addEventListener('input', (e) => {
                if (!e.target.matches('.multiselect-input')) return;
                if (e.isComposing) return;
                const ui = this._ui[cat];
                if (!ui) return;
                ui.query = e.target.value;
                ui.activeIndex = -1;
                ui.open = true;
                this.render(cat);
              });

              // IME 確定完了後、最終的な確定値で再描画
              root.addEventListener('compositionend', (e) => {
                if (!e.target.matches('.multiselect-input')) return;
                const ui = this._ui[cat];
                if (!ui) return;
                ui.query = e.target.value;
                ui.activeIndex = -1;
                ui.open = true;
                this.render(cat);
              });

              root.addEventListener('keydown', (e) => {
                if (!e.target.matches('.multiselect-input')) return;
                // IME 変換中の Enter / Escape / ArrowDown は IME 側に渡す
                if (e.isComposing) return;
                if (e.key === 'ArrowDown') { e.preventDefault(); this.moveActive(cat, 1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); this.moveActive(cat, -1); }
                else if (e.key === 'Enter') { e.preventDefault(); this.confirmActive(cat); }
                else if (e.key === 'Escape') { e.preventDefault(); this.close(cat); }
                else if (e.key === 'Backspace' && e.target.value === '') {
                  const selected = this.getSelected(cat);
                  if (selected.length > 0) {
                    e.preventDefault();
                    this.removeValue(cat, selected[selected.length - 1]);
                  }
                }
              });
            });

            // 外クリック検出は App.bindEvents に集約
          },

          // 開いている multiselect をすべて閉じる（App 側の document ハンドラから呼ばれる）
          closeAll() {
            this.CATEGORIES.forEach(cat => {
              if (this._ui[cat]?.open) this.close(cat);
            });
          },
        },

        // ===== 写真アップロード（モーダル内）=====
        // ファイル選択 → リサイズ（1600px / JPEG 0.80）→ プレビュー
        // 保存時に IDB へ書き込み、draft.photos は { id } 参照のみ
        photoUpload: {
          MAX_LONG_EDGE: 1600,
          JPEG_QUALITY: 0.80,
          MAX_PHOTOS_PER_UPLOAD: 10,

          // 編集中の写真候補 [{ id, dataURL, isNew }]。modalSave で IDB に書く
          // isNew=true: 新規アップロード（IDB に未保存、commitToDraft で put が必要）
          // isNew=false: 既存写真ロード（IDB に既にある、put 不要）
          _pending: [],
          _eventsBound: false,

          resetAndRender() {
            this._pending = [];
            this.render();
          },

          // 編集モーダル開始時、既存 trip の写真を IDB から読み込んで pending に展開
          async loadFromTrip(photoRefs) {
            this._pending = [];
            if (!photoRefs || photoRefs.length === 0) {
              this.render();
              return;
            }
            try {
              const ids = photoRefs.map(r => r.id);
              const photos = await App.photoDB.getMany(ids);
              this._pending = photos
                .filter(p => p !== null)
                .map(p => ({ id: p.id, dataURL: p.dataURL, isNew: false }));
            } catch (err) {
              console.error('既存写真の読み込みに失敗', err);
            }
            this.render();
          },

          render() {
            const list = App.el['photo-upload-list'];
            if (!list) return;
            list.innerHTML = this._pending.map(p => `
              <div class="photo-upload-item">
                <img src="${p.dataURL}" alt="" />
                <button class="photo-upload-item-remove" type="button" data-id="${App.escape(p.id)}" aria-label="削除">×</button>
              </div>
            `).join('');
          },

          // createImageBitmap + Canvas でリサイズ。EXIF orientation は imageOrientation: 'from-image' で反映
          async resizeImage(file) {
            const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
            let width = bitmap.width;
            let height = bitmap.height;
            if (Math.max(width, height) > this.MAX_LONG_EDGE) {
              const scale = this.MAX_LONG_EDGE / Math.max(width, height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
              bitmap.close();
              throw new Error('Canvas 2D コンテキストが取得できませんでした（メモリ不足の可能性）');
            }
            ctx.drawImage(bitmap, 0, 0, width, height);
            bitmap.close();
            return canvas.toDataURL('image/jpeg', this.JPEG_QUALITY);
          },

          async addFiles(fileList) {
            const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
            if (files.length === 0) return;
            if (this._pending.length + files.length > this.MAX_PHOTOS_PER_UPLOAD) {
              alert(`写真は最大 ${this.MAX_PHOTOS_PER_UPLOAD} 枚までです\n（現在: ${this._pending.length} 枚、追加しようとした枚数: ${files.length} 枚）`);
              return;
            }
            const progress = App.el['photo-upload-progress'];
            let completed = 0;
            progress.hidden = false;
            for (const file of files) {
              progress.textContent = `処理中... ${++completed}/${files.length}`;
              try {
                const dataURL = await this.resizeImage(file);
                this._pending.push({ id: crypto.randomUUID(), dataURL, isNew: true });
                this.render();
              } catch (err) {
                console.error('写真処理に失敗:', file.name, err);
              }
            }
            progress.hidden = true;
          },

          removePending(id) {
            this._pending = this._pending.filter(p => p.id !== id);
            this.render();
          },

          // modalSave 時に呼ばれる。pending の isNew=true のみ IDB に書く（既存は put 不要）。
          // 1 枚でも失敗があれば throw して呼び出し側に伝える（中途半端な保存を防ぐため）
          async commitToDraft() {
            const refs = [];
            const failures = [];
            const now = Date.now();
            for (const p of this._pending) {
              try {
                if (p.isNew) {
                  await App.photoDB.put({ id: p.id, dataURL: p.dataURL, createdAt: now });
                }
                refs.push({ id: p.id });
              } catch (err) {
                console.error('写真の IDB 保存に失敗:', err);
                failures.push(p.id);
              }
            }
            if (failures.length > 0) {
              throw new Error(`写真 ${failures.length} 枚の保存に失敗しました`);
            }
            return refs;
          },

          bindEvents() {
            if (this._eventsBound) return;
            this._eventsBound = true;
            const area = App.el['photo-upload-area'];
            const input = App.el['photo-upload-input'];
            const list = App.el['photo-upload-list'];
            if (!area || !input || !list) return;

            area.addEventListener('click', () => input.click());
            input.addEventListener('change', (e) => {
              this.addFiles(e.target.files);
              input.value = ''; // 同一ファイル再選択を許可
            });

            area.addEventListener('dragover', (e) => {
              e.preventDefault();
              area.classList.add('dragging');
            });
            area.addEventListener('dragleave', () => area.classList.remove('dragging'));
            area.addEventListener('drop', (e) => {
              e.preventDefault();
              area.classList.remove('dragging');
              if (e.dataTransfer?.files) this.addFiles(e.dataTransfer.files);
            });

            list.addEventListener('click', (e) => {
              const btn = e.target.closest('.photo-upload-item-remove');
              if (!btn) return;
              this.removePending(btn.dataset.id);
            });
          },
        },

        // ===== 絞り込み（左パネルの 3 セクション独立）=====
        // 同カテゴリ内は OR、カテゴリ間は AND
        filter: {
          STORAGE_KEY: 'tabibako_filter',
          CATEGORIES: ['transport', 'companions', 'tags'],
          LABELS: {
            transport: '移動手段',
            companions: '同行者',
            tags: 'タグ',
          },
          _selected: { transport: [], companions: [], tags: [] },
          _eventsBound: false,

          load() {
            try {
              const raw = localStorage.getItem(this.STORAGE_KEY);
              if (raw) {
                const data = JSON.parse(raw);
                for (const cat of this.CATEGORIES) {
                  if (Array.isArray(data[cat])) this._selected[cat] = data[cat];
                }
              }
            } catch (err) {
              console.error('絞り込み状態の読み込み失敗', err);
            }
          },

          save() {
            try {
              localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this._selected));
            } catch (err) {
              console.error('絞り込み状態の保存失敗', err);
            }
          },

          // 全カテゴリで未選択 = フィルタなし
          isEmpty() {
            return this.CATEGORIES.every(c => this._selected[c].length === 0);
          },

          // プールから削除された値が _selected に残るとロックされた状態になるため、
          // render の都度 pool との整合性を取り直す
          _syncWithPool() {
            let changed = false;
            for (const cat of this.CATEGORIES) {
              const pool = App.multiSelect.getPool(cat);
              const before = this._selected[cat].length;
              this._selected[cat] = this._selected[cat].filter(v => pool.includes(v));
              if (this._selected[cat].length !== before) changed = true;
            }
            if (changed) this.save();
          },

          // フィルタを旅行配列に適用
          apply(trips) {
            if (this.isEmpty()) return trips;
            return trips.filter(trip => {
              for (const cat of this.CATEGORIES) {
                const sel = this._selected[cat];
                if (sel.length === 0) continue;
                const tripValues = trip[cat] || [];
                // OR within category
                if (!sel.some(v => tripValues.includes(v))) return false;
              }
              return true;
            });
          },

          toggle(category, value) {
            const sel = this._selected[category];
            const i = sel.indexOf(value);
            if (i >= 0) sel.splice(i, 1);
            else sel.push(value);
            this.save();
            this.render();
            App.renderTripList();
          },

          render() {
            // 描画前にプールと _selected の整合性を取り直す
            this._syncWithPool();

            const container = App.el['filter-section'];
            if (!container) return;
            // プールに何も値がなければセクションごと非表示
            const hasAnyValue = this.CATEGORIES.some(c => App.multiSelect.getPool(c).length > 0);
            if (!hasAnyValue) {
              container.hidden = true;
              container.innerHTML = '';
              return;
            }
            container.hidden = false;
            container.innerHTML = this.CATEGORIES.map(cat => {
              const pool = App.multiSelect.getPool(cat);
              const sel = this._selected[cat];
              const chipsHtml = pool.length > 0
                ? pool.map(v => {
                    const active = sel.includes(v);
                    return `<span class="filter-chip${active ? ' active' : ''}" data-value="${App.escape(v)}" role="button" tabindex="0" aria-pressed="${active}">${App.escape(v)}</span>`;
                  }).join('')
                : '<span class="filter-empty">なし</span>';
              return `
                <div class="filter-group" data-category="${cat}">
                  <div class="filter-group-label">${this.LABELS[cat]}</div>
                  <div class="filter-tags">${chipsHtml}</div>
                </div>
              `;
            }).join('');
          },

          bindEvents() {
            if (this._eventsBound) return;
            this._eventsBound = true;
            const container = App.el['filter-section'];
            if (!container) return;
            const handleChipActivate = (target) => {
              const chip = target.closest('.filter-chip');
              if (!chip || !chip.dataset.value) return;
              const group = chip.closest('.filter-group');
              if (!group) return;
              this.toggle(group.dataset.category, chip.dataset.value);
            };
            container.addEventListener('click', (e) => handleChipActivate(e.target));
            container.addEventListener('keydown', (e) => {
              if (e.key !== 'Enter' && e.key !== ' ') return;
              if (!e.target.matches('.filter-chip')) return;
              e.preventDefault();
              handleChipActivate(e.target);
            });
          },
        },

        // ===== ソート（左パネル旅行一覧）=====
        sort: {
          STORAGE_KEY: 'tabibako_sort',
          DEFAULT: 'date-desc',
          OPTIONS: [
            { value: 'date-desc', label: '日程（新しい順）' },
            { value: 'date-asc',  label: '日程（古い順）' },
            { value: 'name-asc',  label: '旅行名（あいうえお順）' },
          ],
          _open: false,
          _eventsBound: false,

          getCurrent() {
            const stored = localStorage.getItem(this.STORAGE_KEY);
            // localStorage が手動編集された場合や旧バージョンの値が残った場合のフォールバック
            return this.OPTIONS.some(o => o.value === stored) ? stored : this.DEFAULT;
          },
          setCurrent(value) {
            if (!this.OPTIONS.some(o => o.value === value)) return;
            localStorage.setItem(this.STORAGE_KEY, value);
          },

          // 旅行配列をソートして返す（元配列は変更しない）
          apply(trips) {
            const cur = this.getCurrent();
            const arr = [...trips];
            if (cur === 'date-desc') {
              arr.sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
            } else if (cur === 'date-asc') {
              arr.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
            } else if (cur === 'name-asc') {
              arr.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ja'));
            }
            return arr;
          },

          toggle() { this._open = !this._open; this.render(); },
          close()  { this._open = false; this.render(); },

          render() {
            const dropdown = App.el['sort-dropdown'];
            const btn = App.el['sort-btn'];
            if (!dropdown) return;
            btn?.setAttribute('aria-expanded', String(this._open));
            if (!this._open) {
              dropdown.hidden = true;
              dropdown.innerHTML = '';
              return;
            }
            const cur = this.getCurrent();
            dropdown.innerHTML = this.OPTIONS.map(opt => `
              <div class="sort-option${opt.value === cur ? ' active' : ''}" data-sort="${App.escape(opt.value)}" role="menuitem">${App.escape(opt.label)}</div>
            `).join('');
            dropdown.hidden = false;
          },

          bindEvents() {
            if (this._eventsBound) return;
            this._eventsBound = true;
            const btn = App.el['sort-btn'];
            const dropdown = App.el['sort-dropdown'];
            if (!btn || !dropdown) return;
            btn.addEventListener('click', () => this.toggle());
            dropdown.addEventListener('click', (e) => {
              const opt = e.target.closest('.sort-option');
              if (!opt) return;
              this.setCurrent(opt.dataset.sort);
              this.close();
              App.renderTripList();
            });
          },
        },

        // ===== 写真ビューア（右パネル上部）=====
        // 選択中の旅行の写真を 1 枚ずつ表示。矢印 / キーボードで切替
        photoViewer: {
          _photos: [],    // [{ id, dataURL, createdAt }]
          _index: 0,
          _loading: false,
          _eventsBound: false,

          async load(trip) {
            if (!trip || !trip.photos || trip.photos.length === 0) {
              this._photos = [];
              this._index = 0;
              this.render();
              return;
            }
            this._loading = true;
            this.render();
            try {
              const ids = trip.photos.map(p => p.id);
              const photos = await App.photoDB.getMany(ids);
              this._photos = photos.filter(p => p !== null);
              this._index = 0;
            } catch (err) {
              console.error('写真の読み込みに失敗', err);
              this._photos = [];
            } finally {
              this._loading = false;
              this.render();
            }
          },

          clear() {
            this._photos = [];
            this._index = 0;
            this.render();
          },

          render() {
            const container = App.el['photo-viewer'];
            if (!container) return;
            if (this._loading) {
              container.innerHTML = `<div style="font-size:11px;color:var(--color-text-secondary)">読み込み中…</div>`;
              return;
            }
            if (this._photos.length === 0) {
              container.innerHTML = `<i class="ti ti-photo" style="font-size:36px; opacity:0.4" aria-hidden="true"></i>`;
              return;
            }
            const current = this._photos[this._index];
            const total = this._photos.length;
            container.innerHTML = `
              <img class="photo-viewer-image" src="${App.escape(current.dataURL)}" alt="" />
              ${total > 1 ? `
                <button class="photo-viewer-arrow photo-viewer-arrow-prev" type="button" aria-label="前の写真">
                  <i class="ti ti-chevron-left" aria-hidden="true"></i>
                </button>
                <button class="photo-viewer-arrow photo-viewer-arrow-next" type="button" aria-label="次の写真">
                  <i class="ti ti-chevron-right" aria-hidden="true"></i>
                </button>
                <div class="photo-viewer-counter">${this._index + 1} / ${total}</div>
              ` : ''}
            `;
          },

          prev() {
            if (this._photos.length === 0) return;
            this._index = (this._index - 1 + this._photos.length) % this._photos.length;
            this.render();
          },

          next() {
            if (this._photos.length === 0) return;
            this._index = (this._index + 1) % this._photos.length;
            this.render();
          },

          bindEvents() {
            if (this._eventsBound) return;
            this._eventsBound = true;
            const viewer = App.el['photo-viewer'];
            if (!viewer) return;

            viewer.addEventListener('click', (e) => {
              if (e.target.closest('.photo-viewer-arrow-prev')) this.prev();
              else if (e.target.closest('.photo-viewer-arrow-next')) this.next();
            });
            // document.keydown は App.bindEvents に集約
          },

          // App 側の document keydown ハンドラから呼ばれる
          handleArrowKey(e) {
            if (this._photos.length <= 1) return;
            const a = document.activeElement;
            if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
            if (!App.el['modal-backdrop'].hidden) return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); this.prev(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); this.next(); }
          },
        },

        // ===== パネルリサイズ（左右パネルの幅をドラッグで変更）=====
        // Issue #3。grid-template-columns を動的に書き換え、Leaflet には rAF で invalidateSize
        panelResize: {
          STORAGE_KEY: 'tabibako_panel_widths',
          DEFAULT_LEFT: 384,
          DEFAULT_RIGHT: 390,
          MIN_LEFT: 240,
          MIN_RIGHT: 280,
          MIN_CENTER: 320,
          HANDLE_WIDTH: 4,

          _left: 384,
          _right: 390,
          _dragging: null,
          _dragStartX: 0,
          _dragStartLeft: 0,
          _dragStartRight: 0,
          _rafScheduled: false,
          _eventsBound: false,
          _onMove: null,
          _onUp: null,
          _onBlur: null,

          load() {
            this._left = this.DEFAULT_LEFT;
            this._right = this.DEFAULT_RIGHT;
            try {
              const raw = localStorage.getItem(this.STORAGE_KEY);
              if (raw) {
                const data = JSON.parse(raw);
                if (Number.isFinite(data.left)) this._left = data.left;
                if (Number.isFinite(data.right)) this._right = data.right;
              }
            } catch (err) {
              console.error('パネル幅の読み込み失敗', err);
            }
            // window サイズに収まるよう正規化（上限・下限・小ウィンドウ全部ここで解決）
            this._clampToWindow();
          },

          // _left / _right を window 内に収める。中央地図 MIN_CENTER を優先しつつ、
          // それが叶わない極小ウィンドウでは左右を MIN まで縮め最終的に中央が痩せる
          _clampToWindow() {
            const usable = Math.max(0, window.innerWidth - (this.HANDLE_WIDTH * 2));
            this._left = Math.max(this.MIN_LEFT, this._left);
            this._right = Math.max(this.MIN_RIGHT, this._right);
            const overflow = this._left + this._right + this.MIN_CENTER - usable;
            if (overflow > 0) {
              // 左右を MIN まで縮めて中央を確保。それでも足りなければ MIN で固定（中央が小さくなる）
              const reduceLeft = Math.min(overflow / 2, Math.max(0, this._left - this.MIN_LEFT));
              this._left -= reduceLeft;
              const remaining = overflow - reduceLeft;
              this._right = Math.max(this.MIN_RIGHT, this._right - remaining);
              // 左がまだ縮められる場合はもう一度
              if (this._left + this._right + this.MIN_CENTER > usable) {
                this._left = Math.max(this.MIN_LEFT, usable - this.MIN_CENTER - this._right);
              }
            }
          },

          save() {
            try {
              localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ left: this._left, right: this._right }));
            } catch (err) {
              console.error('パネル幅の保存失敗', err);
            }
          },

          applyWidths() {
            const app = document.querySelector('.app');
            if (!app) return;
            app.style.gridTemplateColumns =
              `${this._left}px ${this.HANDLE_WIDTH}px 1fr ${this.HANDLE_WIDTH}px ${this._right}px`;
            // 地図リサイズは rAF で間引いて呼ぶ（ドラッグ中の高頻度発火対策）
            if (!this._rafScheduled) {
              this._rafScheduled = true;
              requestAnimationFrame(() => {
                this._rafScheduled = false;
                if (App.map) App.map.invalidateSize();
              });
            }
          },

          // 新しい左右幅を計算（最小幅・中央地図最小幅で clamp）
          _calcWidths(side, deltaX) {
            let newLeft = side === 'left' ? this._dragStartLeft + deltaX : this._left;
            let newRight = side === 'right' ? this._dragStartRight - deltaX : this._right;
            newLeft = Math.max(this.MIN_LEFT, newLeft);
            newRight = Math.max(this.MIN_RIGHT, newRight);
            const usable = window.innerWidth - (this.HANDLE_WIDTH * 2);
            if (newLeft + newRight + this.MIN_CENTER > usable) {
              if (side === 'left') {
                newLeft = Math.max(this.MIN_LEFT, usable - this.MIN_CENTER - newRight);
              } else {
                newRight = Math.max(this.MIN_RIGHT, usable - this.MIN_CENTER - newLeft);
              }
            }
            return [newLeft, newRight];
          },

          startDrag(side, e) {
            // 防御：前回ドラッグの cleanup が漏れていたら先に行う（race condition 対策）
            if (this._dragging) this.endDrag();
            this._dragging = side;
            this._dragStartX = e.clientX;
            this._dragStartLeft = this._left;
            this._dragStartRight = this._right;
            document.body.classList.add('resizing');
            const handle = document.querySelector(`.resize-handle[data-side="${side}"]`);
            if (handle) handle.classList.add('dragging');
            // 要素外まで追跡できるよう document にリスナーを張る
            this._onMove = (ev) => this.onDragMove(ev);
            this._onUp = () => this.endDrag();
            // ウィンドウ外で mouseup された場合の救済（ブラウザ外・別ウィンドウへの移動）
            this._onBlur = () => this.endDrag();
            document.addEventListener('mousemove', this._onMove);
            document.addEventListener('mouseup', this._onUp);
            window.addEventListener('blur', this._onBlur);
          },

          onDragMove(e) {
            if (!this._dragging) return;
            const deltaX = e.clientX - this._dragStartX;
            const [newLeft, newRight] = this._calcWidths(this._dragging, deltaX);
            this._left = newLeft;
            this._right = newRight;
            this.applyWidths();
          },

          endDrag() {
            if (!this._dragging) return;
            document.body.classList.remove('resizing');
            document.querySelectorAll('.resize-handle.dragging').forEach(h => h.classList.remove('dragging'));
            if (this._onMove) document.removeEventListener('mousemove', this._onMove);
            if (this._onUp) document.removeEventListener('mouseup', this._onUp);
            if (this._onBlur) window.removeEventListener('blur', this._onBlur);
            this._dragging = null;
            this._onMove = null;
            this._onUp = null;
            this._onBlur = null;
            // ドラッグ終了時のみ永続化（途中保存しない方針）
            this.save();
          },

          resetWidths() {
            this._left = this.DEFAULT_LEFT;
            this._right = this.DEFAULT_RIGHT;
            this.applyWidths();
            this.save();
          },

          bindEvents() {
            if (this._eventsBound) return;
            this._eventsBound = true;
            document.querySelectorAll('.resize-handle').forEach(handle => {
              handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const side = handle.dataset.side;
                if (side === 'left' || side === 'right') this.startDrag(side, e);
              });
              handle.addEventListener('dblclick', () => this.resetWidths());
            });
            // ウィンドウサイズ変更時に幅を再正規化（小ウィンドウへ移行した際に破綻させない）
            window.addEventListener('resize', () => {
              this._clampToWindow();
              this.applyWidths();
            });
          },
        },

        // ===== ヒートマップ（Leaflet.heat 経由）=====
        // ON 時：フィルタ適用後の全旅行の places をヒートマップ表示。選択中のピンは隠す
        heatmap: {
          STORAGE_KEY: 'tabibako_heatmap',
          _enabled: false,
          _layer: null,
          _eventsBound: false,

          init() {
            this._enabled = localStorage.getItem(this.STORAGE_KEY) === 'true';
          },

          save() {
            try { localStorage.setItem(this.STORAGE_KEY, String(this._enabled)); }
            catch (err) { console.error('ヒートマップ状態の保存失敗', err); }
          },

          isEnabled() { return this._enabled; },

          // フィルタ適用後の全旅行の places を [lat, lng] に展開
          getPoints() {
            const trips = App.filter.apply(App.state.trips);
            return trips.flatMap(t => (t.places || []).map(p => [p.lat, p.lng]));
          },

          render() {
            // map 未初期化（init 順序で renderTripList が先に走るケース）では何もしない
            if (!App.map) return;
            // 旧レイヤーを必ず除去
            if (this._layer) {
              App.map.removeLayer(this._layer);
              this._layer = null;
            }
            if (!this._enabled) return;
            const points = this.getPoints();
            if (points.length === 0) return;
            // 少量データでも視認できるよう radius / blur / minOpacity を強め設定
            this._layer = L.heatLayer(points, {
              radius: 35,
              blur: 25,
              maxZoom: 17,
              minOpacity: 0.35,
            }).addTo(App.map);
          },

          toggle() {
            this._enabled = !this._enabled;
            this.save();
            this.render();
            App.renderAllTripPins();    // ON 時は個別ピンを隠すため再描画
            App.updateHeatmapButton();
          },

          bindEvents() {
            if (this._eventsBound) return;
            this._eventsBound = true;
            const btn = App.el['heatmap-btn'];
            if (!btn) return;
            btn.addEventListener('click', () => this.toggle());
            App.updateHeatmapButton();
          },
        },

        // ===== Rendering =====
        renderTripList() {
          // 絞り込み UI を最新の値プールで再描画
          this.filter.render();
          // 順序：heatmap → pins。heatmap.toggle と同じ順序にすることで
          // レイヤー切替時の見た目不整合を防ぐ
          this.heatmap.render();
          this.renderAllTripPins();

          const container = this.el['trip-list'];
          if (this.state.trips.length === 0) {
            container.innerHTML = `
              <div class="trip-list-empty">
                まだ旅行が登録されていません。<br />
                ＋ボタンから追加できるようになります。
              </div>
            `;
            return;
          }
          // 絞り込み → ソートの順で適用（元配列は変更しない）
          let trips = this.filter.apply(this.state.trips);
          trips = this.sort.apply(trips);
          if (trips.length === 0) {
            container.innerHTML = `
              <div class="trip-list-empty">
                絞り込み条件に該当する旅行がありません。
              </div>
            `;
            return;
          }
          const selectedId = this.state.selectedTripId;
          container.innerHTML = trips.map(trip => {
            const isSelected = trip.id === selectedId;
            const allTags = [
              ...(trip.transport || []).map(v => ({ value: v, kind: 'transport' })),
              ...(trip.companions || []).map(v => ({ value: v, kind: 'companions' })),
              ...(trip.tags || []).map(v => ({ value: v, kind: 'tags' })),
            ];
            const tagsHtml = allTags.length > 0 ? `
              <div class="trip-card-tags">
                ${allTags.map(t => `<span class="trip-card-tag trip-card-tag-${t.kind}">${this.escape(t.value)}</span>`).join('')}
              </div>` : '';
            // 訪問地域の表示。日本国内は都道府県・海外は国名。判定不能 or 訪問場所なしのときはバックアップ表示
            const placeCount = (trip.places || []).length;
            const regions = trip.regions || [];
            let geographyText;
            if (placeCount === 0) geographyText = '訪問場所なし';
            else if (regions.length === 0) geographyText = '訪問地域未判定';
            else geographyText = regions.join('・');
            // Issue #9: 1 枚目の写真があればサムネ要素を描画（src は後段で async に差し込む）
            const firstPhotoId = trip.photos && trip.photos[0] ? trip.photos[0].id : null;
            const thumbHtml = firstPhotoId
              ? `<img class="trip-card-thumb" data-photo-id="${this.escape(firstPhotoId)}" alt="">`
              : '';
            return `
            <div class="trip-card${isSelected ? ' selected' : ''}" data-trip-id="${this.escape(trip.id)}"
                 role="button" tabindex="0" aria-pressed="${isSelected ? 'true' : 'false'}">
              <div class="trip-card-body">
                <div class="trip-card-name">${this.escape(trip.name)}</div>
                <div class="trip-card-meta">
                  <div class="trip-card-meta-row">
                    <i class="ti ti-calendar" style="font-size:11px" aria-hidden="true"></i>
                    <span>${this.escape(trip.startDate)} 〜 ${this.escape(trip.endDate)}</span>
                  </div>
                  <div class="trip-card-meta-row">
                    <i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i>
                    <span>${this.escape(geographyText)}</span>
                  </div>
                </div>
                ${tagsHtml}
              </div>
              ${thumbHtml}
            </div>
          `;
          }).join('');
          // サムネ画像を IndexedDB から非同期で取得して src に差し込む
          this.loadTripCardThumbnails();
        },

        // 各 trip-card 内のサムネ <img> に対し、photoDB から dataURL を取得して src を設定する。
        // 取得失敗時はサムネ要素を取り除き、領域も確保しない（写真なしと同等の見た目に倒す）。
        async loadTripCardThumbnails() {
          const thumbs = this.el['trip-list'].querySelectorAll('.trip-card-thumb[data-photo-id]');
          for (const img of thumbs) {
            const id = img.dataset.photoId;
            if (!id) continue;
            try {
              const photo = await this.photoDB.get(id);
              if (photo && photo.dataURL) {
                img.src = photo.dataURL;
              } else {
                img.remove();
              }
            } catch (err) {
              console.error('カードサムネの取得に失敗', err);
              img.remove();
            }
          }
        },

        // 右パネル詳細：選択中の旅行の情報を描画。空のセクションは非表示
        renderTripDetail() {
          const container = this.el['detail-body'];
          const trip = this.getSelectedTrip();
          if (!trip) {
            container.innerHTML = `
              <div class="detail-empty">
                旅行を選択すると、<br />ここに詳細が表示されます。
              </div>
            `;
            return;
          }

          const sections = [];

          sections.push(`
            <div class="detail-section">
              <div class="detail-section-label">日程</div>
              <div class="detail-section-value">${this.escape(trip.startDate)} 〜 ${this.escape(trip.endDate)}</div>
            </div>
          `);

          if (trip.regions && trip.regions.length > 0) {
            sections.push(`
              <div class="detail-section">
                <div class="detail-section-label">訪問地域</div>
                <div class="detail-section-value">${this.escape(trip.regions.join('・'))}</div>
              </div>
            `);
          }

          if (trip.places && trip.places.length > 0) {
            const placeListHtml = trip.places.map(p => `
              <li class="detail-place-item">
                <i class="ti ti-map-pin" style="font-size:11px" aria-hidden="true"></i>
                <span>${this.escape(p.name)}</span>
              </li>
            `).join('');
            sections.push(`
              <div class="detail-section">
                <div class="detail-section-label">訪問場所（${trip.places.length} か所）</div>
                <ul class="detail-place-list">${placeListHtml}</ul>
              </div>
            `);
          }

          // 宿泊所は訪問地の直下に配置（Issue #7 のモーダル UI 順と整合）
          const accName = trip.accommodation?.name;
          if (accName) {
            sections.push(`
              <div class="detail-section">
                <div class="detail-section-label">宿泊所</div>
                <div class="detail-section-value">${this.escape(accName)}</div>
              </div>
            `);
          }

          if (trip.transport && trip.transport.length > 0) {
            sections.push(`
              <div class="detail-section">
                <div class="detail-section-label">移動手段</div>
                <div class="detail-tags">${trip.transport.map(v => `<span class="detail-tag detail-tag-transport">${this.escape(v)}</span>`).join('')}</div>
              </div>
            `);
          }

          if (trip.companions && trip.companions.length > 0) {
            sections.push(`
              <div class="detail-section">
                <div class="detail-section-label">同行者</div>
                <div class="detail-tags">${trip.companions.map(v => `<span class="detail-tag detail-tag-companions">${this.escape(v)}</span>`).join('')}</div>
              </div>
            `);
          }

          if (trip.tags && trip.tags.length > 0) {
            sections.push(`
              <div class="detail-section">
                <div class="detail-section-label">タグ</div>
                <div class="detail-tags">${trip.tags.map(v => `<span class="detail-tag detail-tag-tags">${this.escape(v)}</span>`).join('')}</div>
              </div>
            `);
          }

          if (trip.memo) {
            sections.push(`
              <div class="detail-section">
                <div class="detail-section-label">メモ</div>
                <div class="detail-memo">${this.escape(trip.memo)}</div>
              </div>
            `);
          }

          container.innerHTML = `
            <div class="detail-content">
              <h2 class="detail-title">${this.escape(trip.name)}</h2>
              ${sections.join('')}
            </div>
          `;
        },

        renderPlaceList() {
          const container = this.el['place-list'];
          const places = this.state.draft?.places || [];
          container.innerHTML = places.map((p, i) => `
            <div class="place-item">
              <span class="place-item-name">${this.escape(p.name)}</span>
              <button class="place-item-remove" type="button" data-index="${i}" aria-label="削除">
                <i class="ti ti-x" style="font-size:12px" aria-hidden="true"></i>
              </button>
            </div>
          `).join('');
          container.querySelectorAll('.place-item-remove').forEach(btn => {
            btn.addEventListener('click', () => {
              const idx = parseInt(btn.dataset.index, 10);
              this.removePlaceFromDraft(idx);
            });
          });
        },

        renderSearchResults(items) {
          const container = this.el['search-results'];

          if (items === null) {
            container.hidden = true;
            container.innerHTML = '';
            return;
          }
          if (items === 'loading') {
            container.hidden = false;
            container.innerHTML = '<div class="search-result-loading">検索中…</div>';
            return;
          }
          if (items.length === 0) {
            container.hidden = false;
            container.innerHTML = '<div class="search-result-empty">該当する場所が見つかりませんでした</div>';
            return;
          }
          container.hidden = false;
          container.innerHTML = items.map((item, i) => `
            <div class="search-result-item" data-index="${i}">${this.escape(item.display_name)}</div>
          `).join('');
          container.querySelectorAll('.search-result-item').forEach((el, i) => {
            el.addEventListener('click', () => {
              const item = items[i];
              this.addPlaceToDraft({
                name: item.display_name,
                lat: parseFloat(item.lat),
                lng: parseFloat(item.lon),
              });
            });
          });
        },

        // ===== Helpers =====
        // 訪問地域を display_name から抽出：日本国内は都道府県、海外は国名（display_name 末尾）。
        // PREFECTURES の配列順は包含判定の優先順位を兼ねる（「東京都」が「京都府」より先）。
        extractRegion(name) {
          if (!name) return null;
          // 逆引き失敗時のフォールバック座標表示「(35.0000, 139.0000)」は地域判定不能
          if (/^\([-\d.]+\s*,\s*[-\d.]+\)$/.test(name)) return null;
          const pref = PREFECTURES.find(p => name.includes(p));
          if (pref) return pref;
          // 都道府県マッチなし → 海外。カンマ区切り末尾を国名として扱う
          const parts = name.split(',').map(s => s.trim()).filter(Boolean);
          if (parts.length === 0) return null;
          return parts[parts.length - 1];
        },

        // trip.regions を trip.places の region から再計算（重複除去）
        recomputeRegions(trip) {
          if (!trip) return;
          const places = trip.places || [];
          trip.regions = [...new Set(places.map(p => p.region).filter(Boolean))];
        },

        debounce(fn, ms) {
          let timer;
          return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => fn(...args), ms);
          };
        },

        escape(str) {
          if (str == null) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        },
      };

      window.devClearAll = async function () {

        const keys = [
          STORAGE_KEY,
          ...Object.values(App.multiSelect.POOL_KEYS),
          App.filter.STORAGE_KEY,
          App.sort.STORAGE_KEY,
          App.heatmap.STORAGE_KEY,
        ];
        keys.forEach(k => localStorage.removeItem(k));
        try {
          const db = App.photoDB._db;
          if (db) {
            const tx = db.transaction('photos', 'readwrite');
            tx.objectStore('photos').clear();
            await new Promise(r => { tx.oncomplete = r; });

        } catch (err) {
          console.warn('IDB クリアで例外:', err);
